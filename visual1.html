<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Industrial Techno</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #webgl-canvas { z-index: 1; }
        #overlay-canvas { 
            z-index: 2; 
            background: transparent; 
            pointer-events: none; 
        }
        #strobe-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
        }
        #start-screen {
            position: absolute;
            z-index: 10;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            cursor: pointer;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<div id="start-screen">Click to initialize audio visualizer</div>
<canvas id="webgl-canvas"></canvas>
<canvas id="overlay-canvas"></canvas>
<div id="strobe-layer"></div>

<script>
    // --- STATE & CONFIG ---
    let audioContext, analyser, dataArray;
    let audioEnergy = 0;
    let isRunning = false;
    let lastTime = 0;
    
    let lastTapTime = 0;
    let bpmInterval = 500; 
    let lastBeatTrigger = 0;

    // Advanced Rate of Change Engine
    // Calculates exact millisecond delta between presses (50ms = extremely fast, 4000ms = extremely slow)
    const keyState = {
        '1': { lastPress: 0, delta: 2000 },
        '2': { lastPress: 0, delta: 2000 },
        '3': { lastPress: 0, delta: 2000 },
        '4': { lastPress: 0, delta: 2000 },
        '5': { lastPress: 0, delta: 2000 },
        '6': { lastPress: 0, delta: 2000 },
        'ArrowLeft': { lastPress: 0, delta: 2000 }
    };

    const colors = [
        {r: 255, g: 182, b: 193}, // Soft pink
        {r: 173, g: 216, b: 230}, // Soft blue
        {r: 255, g: 255, b: 255}  // White
    ];
    // Exact 45, 90, 135, 180 degrees in radians
    const angles = [Math.PI/4, Math.PI/2, Math.PI*0.75, Math.PI]; 
    const activeEntities = [];

    // --- INPUT LOGIC ---
    function updateRate(key) {
        const now = performance.now();
        const state = keyState[key];
        if (state.lastPress > 0) {
            let d = now - state.lastPress;
            if (d < 4000) { 
                // Smooth out the delta so it doesn't jump wildly on one off-beat press
                state.delta = (state.delta * 0.4) + (d * 0.6);
            }
        }
        state.lastPress = now;
    }

    // Maps a time delta to a visual parameter range
    function mapDelta(delta, fastVal, slowVal) {
        let clamped = Math.max(50, Math.min(4000, delta));
        let t = (clamped - 50) / (4000 - 50); // 0 = fast, 1 = slow
        return fastVal + t * (slowVal - fastVal);
    }

    window.addEventListener('keydown', (e) => {
        if (!isRunning) return;
        if (keyState[e.key] !== undefined) {
            updateRate(e.key);
        } else if (e.key === 'ArrowRight') {
            const now = performance.now();
            if (lastTapTime > 0 && (now - lastTapTime) < 2000) {
                bpmInterval = now - lastTapTime;
            }
            lastTapTime = now;
            lastBeatTrigger = now; 
            spawnEntities();
        } else if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'visual2.html', 2000);
        }
    });

    // --- AUDIO SETUP ---
    async function initAudio() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('start-screen').style.display = 'none';
            isRunning = true;
            requestAnimationFrame(render);
        } catch (err) {
            alert("Microphone access required.");
        }
    }
    document.getElementById('start-screen').addEventListener('click', initAudio);

    // --- WEBGL BACKGROUND ---
    const glCanvas = document.getElementById('webgl-canvas');
    const gl = glCanvas.getContext('webgl', { alpha: false });

    const vsSource = `
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const fsSource = `
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_audio;
        uniform float u_hueSpeed;
        uniform float u_density;
        uniform float u_speed;
        uniform float u_glitch;

        vec3 hueShift(vec3 color, float hue) {
            const vec3 k = vec3(0.57735);
            float cosAngle = cos(hue);
            return vec3(color * cosAngle + cross(k, color) * sin(hue) + k * dot(k, color) * (1.0 - cosAngle));
        }

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        float map(vec3 p) {
            vec3 q = p;
            q.z -= u_time * u_speed;
            q.x += sin(q.z * 5.0 + u_time) * u_glitch * 0.5;
            
            float spacing = u_density; 
            q.xy = mod(q.xy + spacing * 0.5, spacing) - spacing * 0.5;
            q.xy *= rot(q.z * 0.05);
            
            vec3 d = abs(q) - vec3(0.1 + u_audio * 0.2);
            return min(max(d.x, max(d.y, d.z)), 0.0) + length(max(d, 0.0));
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            vec3 ro = vec3(0.0, 0.0, -2.0);
            vec3 rd = normalize(vec3(uv, 1.0));
            
            float t = 0.0;
            for(int i = 0; i < 80; i++) {
                vec3 p = ro + rd * t;
                float d = map(p);
                if(d < 0.001 || t > 15.0) break;
                t += d;
            }
            
            vec3 col = vec3(0.0);
            if(t < 15.0) {
                float fog = exp(-0.15 * t);
                col = vec3(0.15, 0.15, 0.18) * fog; // Industrial concrete/steel base
                col += vec3(0.6, 0.2, 0.9) * u_audio * fog * 1.5; // Neon bleed
            }
            
            col = hueShift(col, u_time * u_hueSpeed);
            col *= 1.0 - dot(uv, uv) * 0.7; // Heavy vignette for basement feel
            gl_FragColor = vec4(col, 1.0);
        }
    `;

    function compileShader(gl, source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl, vsSource, gl.VERTEX_SHADER));
    gl.attachShader(program, compileShader(gl, fsSource, gl.FRAGMENT_SHADER));
    gl.linkProgram(program);
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
        res: gl.getUniformLocation(program, "u_resolution"),
        time: gl.getUniformLocation(program, "u_time"),
        audio: gl.getUniformLocation(program, "u_audio"),
        hueSpeed: gl.getUniformLocation(program, "u_hueSpeed"),
        density: gl.getUniformLocation(program, "u_density"),
        speed: gl.getUniformLocation(program, "u_speed"),
        glitch: gl.getUniformLocation(program, "u_glitch")
    };

    function resize() {
        glCanvas.width = window.innerWidth;
        glCanvas.height = window.innerHeight;
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
        ctxCanvas.width = window.innerWidth;
        ctxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    
    // --- 2D FOREGROUND ---
    const ctxCanvas = document.getElementById('overlay-canvas');
    const ctx = ctxCanvas.getContext('2d');
    resize();

    function drawFineArrow(x, y, radius, angle, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
        ctx.lineWidth = 2.5; // Fine but visible line
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let startOff = radius + 10; 
        let lineLength = radius + 150; // Long line extending far past circle

        ctx.beginPath();
        ctx.moveTo(0, -startOff);
        ctx.lineTo(0, -lineLength);
        
        // Fine arrowhead pointing outwards
        ctx.lineTo(-8, -lineLength + 20);
        ctx.moveTo(0, -lineLength);
        ctx.lineTo(8, -lineLength + 20);
        
        ctx.stroke();
        ctx.restore();
    }

    function spawnEntities() {
        let spawnChance = mapDelta(keyState['3'].delta, 1.0, 0.05); // Density maps to amount
        if (Math.random() > spawnChance) return;

        let arrowChance = mapDelta(keyState['4'].delta, 1.0, 0.0);
        
        let count = Math.floor(1 + Math.random() * 3);
        for(let i=0; i<count; i++) {
            activeEntities.push({
                x: Math.random() * ctxCanvas.width,
                y: Math.random() * ctxCanvas.height,
                radius: 5 + Math.random() * 50 * audioEnergy,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1.0,
                hasArrow: Math.random() < arrowChance,
                arrowAngle: angles[Math.floor(Math.random() * angles.length)]
            });
        }
    }

    // --- RENDER LOOP ---
    function render(time) {
        requestAnimationFrame(render);
        
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioEnergy = sum / dataArray.length / 255;

        if (time - lastBeatTrigger > bpmInterval) {
            if (audioEnergy > 0.4 || (time - lastTapTime > 0)) {
                spawnEntities();
                lastBeatTrigger = time;
            }
        }

        // Apply advanced mapped parameters based on exact tap frequencies
        let dynHueSpeed = mapDelta(keyState['1'].delta, 4.0, 0.1);
        let dynStrobeSpeed = mapDelta(keyState['2'].delta, 30.0, 2.0); 
        let dynStrobeIntens = mapDelta(keyState['2'].delta, 1.0, 0.0);
        let dynBgDensity = mapDelta(keyState['5'].delta, 0.5, 3.0); // Fast = dense (smaller spacing)
        let dynBgSpeed = mapDelta(keyState['6'].delta, 15.0, 1.0);
        let dynGlitch = mapDelta(keyState['ArrowLeft'].delta, 2.0, 0.0);

        // WebGL Draw
        gl.uniform2f(uniforms.res, glCanvas.width, glCanvas.height);
        gl.uniform1f(uniforms.time, time * 0.001);
        gl.uniform1f(uniforms.audio, audioEnergy);
        gl.uniform1f(uniforms.hueSpeed, dynHueSpeed);
        gl.uniform1f(uniforms.density, dynBgDensity);
        gl.uniform1f(uniforms.speed, dynBgSpeed);
        gl.uniform1f(uniforms.glitch, dynGlitch);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // 2D Draw
        ctx.clearRect(0, 0, ctxCanvas.width, ctxCanvas.height);
        
        for (let i = activeEntities.length - 1; i >= 0; i--) {
            let e = activeEntities[i];
            e.life -= 0.01 + (audioEnergy * 0.02);
            e.radius += 2.0 + (audioEnergy * 5.0);

            if (e.life <= 0) {
                activeEntities.splice(i, 1);
                continue;
            }

            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${e.color.r}, ${e.color.g}, ${e.color.b}, ${e.life})`;
            ctx.fill();

            if (e.hasArrow) {
                drawFineArrow(e.x, e.y, e.radius, e.arrowAngle, e.life);
            }
        }

        // Strobe logic
        const strobeLayer = document.getElementById('strobe-layer');
        if (dynStrobeIntens > 0.05) {
            let flash = Math.sin(time * 0.001 * dynStrobeSpeed) > 0 ? dynStrobeIntens : 0;
            strobeLayer.style.opacity = flash * (0.3 + audioEnergy * 0.7);
        } else {
            strobeLayer.style.opacity = 0;
        }
    }
</script>
</body>
</html>

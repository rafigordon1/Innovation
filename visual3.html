<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Autonomous FFT Cavern</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ WAITING FOR AUDIO - CLICK ANYWHERE TO START ]</div>
<canvas id="webgl-canvas"></canvas>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // Smoothed FFT Bands
    let smoothedBass = 0;
    let smoothedMids = 0;
    let smoothedTreble = 0;
    let smoothedEnergy = 0;

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85; // Slightly less smoothing for punchier reactions
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            
            audioInitialized = true;
            if (audioContext.state === 'running') {
                isRunning = true;
                requestAnimationFrame(render);
            }
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE ACCESS DENIED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
            requestAnimationFrame(render);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- WEBGL SHADER ---
    const glCanvas = document.getElementById('webgl-canvas');
    const gl = glCanvas.getContext('webgl', { alpha: false, antialias: false });

    const vsSource = `
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const fsSource = `
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_audio;
        
        uniform float u_hueSpeed;
        uniform float u_zoom;
        uniform float u_deform;
        uniform float u_spin;
        uniform float u_glitch;

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        vec2 map(vec3 p) {
            vec3 z = p;
            
            // Forward movement driven heavily by bass
            z.z -= u_time * u_zoom;
            
            // Save xy coordinate to carve out a protective tunnel for the camera
            vec2 core = z.xy;
            
            // Treble twists the whole tunnel
            z.xy *= rot(z.z * u_glitch * 0.05 + sin(u_time * 0.5) * 0.05);
            
            // Infinite grid repetition
            float grid = 4.0; 
            z = mod(z + grid/2.0, grid) - grid/2.0;
            
            float scale = 1.0;
            
            // Mids drive rotation of the fractal
            float foldAngle1 = (u_time * 0.2) * u_spin + u_deform;
            float foldAngle2 = (u_time * 0.1) * u_spin - u_deform;
            
            // Stable KIFS Fractal Loop
            for(int i = 0; i < 4; i++) { 
                z = abs(z) - vec3(0.5 + u_deform * 0.2, 0.4, 0.3);
                z.xy *= rot(foldAngle1 + float(i));
                z.xz *= rot(foldAngle2);
                
                float k = 1.5;
                z *= k;
                scale *= k;
            }
            
            // Use spherical primitive for absolute distance stability
            float dist = length(z) / scale;
            
            // FOOLPROOF CAMERA PROTECTION: Carve a hollow cylinder down the Z axis.
            // This ensures distance is never negative at the camera origin, stopping the black screen bug.
            float tube = length(core) - (0.6 + u_audio * 0.4); 
            dist = max(dist, -tube);
            
            return vec2(dist, 1.0);
        }

        vec3 getNeonColor(vec3 p) {
            float colorSeed = fract(p.x * 0.1 + p.z * 0.1 + u_time * u_hueSpeed * 0.3);
            
            // Strictly Soft Pink, Soft Blue, White
            if (colorSeed < 0.33) {
                return vec3(1.0, 0.6, 0.75); // Soft Pink
            } else if (colorSeed < 0.66) {
                return vec3(0.5, 0.8, 1.0); // Soft Blue
            } else {
                return vec3(0.9, 0.9, 1.0); // White
            }
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            
            float split = u_glitch * 0.01; // Chromatic aberration
            vec3 ro = vec3(0.0, 0.0, -1.0); // Camera origin safely inside the carved tube
            vec3 col = vec3(0.0);
            
            for (int c = 0; c < 3; c++) {
                vec2 suv = uv;
                if (c == 0) suv.x -= split; 
                if (c == 2) suv.x += split; 
                
                vec3 rd = normalize(vec3(suv, 1.0));
                
                float t = 0.0;
                float accumulatedGlow = 0.0;
                vec2 res;
                vec3 p;
                
                for(int i = 0; i < 70; i++) {
                    p = ro + rd * t;
                    res = map(p);
                    
                    if(res.x < 0.002 || t > 18.0) break;
                    
                    // Add volumetric glow when rays pass close to surfaces
                    accumulatedGlow += (0.01 / (0.01 + res.x * res.x));
                    t += res.x * 0.6; // Safe stepping to prevent clipping inside walls
                }
                
                if(t < 18.0) {
                    float fog = exp(-0.03 * t * t); // Fog depth
                    vec3 neon = getNeonColor(p);
                    
                    // Dark base material with bright neon highlights
                    vec3 baseCol = vec3(0.02); 
                    
                    // Glow heavily multipliers by audio energy
                    float smoothGlow = accumulatedGlow * (0.05 + u_audio * 0.15);
                    baseCol += neon * smoothGlow;
                    
                    if (c == 0) col.r = (baseCol * fog).r;
                    else if (c == 1) col.g = (baseCol * fog).g;
                    else col.b = (baseCol * fog).b;
                }
            }
            
            col *= 1.0 - dot(uv, uv) * 0.7; // Heavy basement vignette
            gl_FragColor = vec4(col, 1.0);
        }
    `;

    function compileShader(gl, source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl, vsSource, gl.VERTEX_SHADER));
    gl.attachShader(program, compileShader(gl, fsSource, gl.FRAGMENT_SHADER));
    gl.linkProgram(program);
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
        res: gl.getUniformLocation(program, "u_resolution"),
        time: gl.getUniformLocation(program, "u_time"),
        audio: gl.getUniformLocation(program, "u_audio"),
        hueSpeed: gl.getUniformLocation(program, "u_hueSpeed"),
        zoom: gl.getUniformLocation(program, "u_zoom"),
        deform: gl.getUniformLocation(program, "u_deform"),
        spin: gl.getUniformLocation(program, "u_spin"),
        glitch: gl.getUniformLocation(program, "u_glitch")
    };

    function resize() {
        glCanvas.width = window.innerWidth;
        glCanvas.height = window.innerHeight;
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    }
    window.addEventListener('resize', resize);
    resize();
    
    // --- RENDER LOOP ---
    function render(time) {
        if (!isRunning) return;
        requestAnimationFrame(render);
        
        analyser.getByteFrequencyData(dataArray);
        
        let bassSum = 0, midSum = 0, trebleSum = 0, totalSum = 0;
        
        const bassEnd = 15;      
        const midEnd = 120;      
        const trebleEnd = 255;   
        
        // SIGNAL BOOSTER: Multiply raw mic signal to force reactivity even on quiet inputs
        const audioMultiplier = 3.5; 
        
        for (let i = 0; i < 256; i++) {
            // Read and boost signal, capping at 1.0 to prevent blowout
            let val = Math.min(1.0, (dataArray[i] / 255.0) * audioMultiplier);
            totalSum += val;
            
            if (i < bassEnd) bassSum += val;
            else if (i < midEnd) midSum += val;
            else if (i < trebleEnd) trebleSum += val;
        }
        
        let rawBass = bassSum / bassEnd;
        let rawMids = midSum / (midEnd - bassEnd);
        let rawTreble = trebleSum / (trebleEnd - midEnd);
        let rawEnergy = totalSum / 256;

        // Smooth output to keep motion fluid, not jittery
        smoothedBass = smoothedBass * 0.8 + rawBass * 0.2;
        smoothedMids = smoothedMids * 0.8 + rawMids * 0.2;
        smoothedTreble = smoothedTreble * 0.8 + rawTreble * 0.2;
        smoothedEnergy = smoothedEnergy * 0.8 + rawEnergy * 0.2;

        // --- EXAGGERATED FFT MAPPING ---
        let dynHueSpeed = 0.2 + (smoothedTreble * 1.5);
        let dynGlitch   = smoothedTreble * 2.0;       // Treble warps screen edges
        
        let dynZoom     = 1.0 + (smoothedBass * 6.0); // Bass violently pushes tunnel forward
        let dynDeform   = smoothedBass * 3.0;         // Bass swells geometry heavily
        
        let dynSpin     = 0.5 + (smoothedMids * 4.0); // Mids cause aggressive rotation

        gl.uniform2f(uniforms.res, glCanvas.width, glCanvas.height);
        gl.uniform1f(uniforms.time, time * 0.001);
        gl.uniform1f(uniforms.audio, smoothedEnergy);
        
        gl.uniform1f(uniforms.hueSpeed, dynHueSpeed);
        gl.uniform1f(uniforms.zoom, dynZoom);
        gl.uniform1f(uniforms.deform, dynDeform);
        gl.uniform1f(uniforms.spin, dynSpin);
        gl.uniform1f(uniforms.glitch, dynGlitch);
        
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
</script>
</body>
</html>

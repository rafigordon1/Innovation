<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Autonomous FFT Cavern</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer; /* Suggests clicking to init audio if blocked */
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 2s ease;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<div id="init-overlay">[ Waiting for Audio Context - Click if paused ]</div>
<canvas id="webgl-canvas"></canvas>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // Smoothed FFT Bands
    let smoothedBass = 0;
    let smoothedMids = 0;
    let smoothedTreble = 0;
    let smoothedEnergy = 0;

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            // 512 bins for detailed frequency isolation
            analyser.fftSize = 512;
            
            // Extreme hardware smoothing to prevent flashing/stuttering
            analyser.smoothingTimeConstant = 0.92; 
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            
            audioInitialized = true;
            if (audioContext.state === 'running') {
                isRunning = true;
                requestAnimationFrame(render);
            }
        } catch (err) {
            console.warn("Microphone access pending or denied.", err);
        }
    }
    
    // Auto-init on load, fallback to click if browser blocks it
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
            requestAnimationFrame(render);
        }
    });

    // Spacebar to navigate back
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- WEBGL HYPNOTIC FRACTAL SHADER ---
    const glCanvas = document.getElementById('webgl-canvas');
    const gl = glCanvas.getContext('webgl', { alpha: false, antialias: false });

    const vsSource = `
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const fsSource = `
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_audio; // Overall energy
        
        // FFT Driven Params
        uniform float u_hueSpeed;
        uniform float u_zoom;
        uniform float u_density;
        uniform float u_deform;
        uniform float u_fog;
        uniform float u_spin;
        uniform float u_glitch;

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        vec2 map(vec3 p) {
            vec3 z = p;
            
            // Bass drives the forward momentum
            z.z -= u_time * u_zoom;
            
            // Treble drives a very subtle chromatic spatial twist
            z.xy *= rot(z.z * u_glitch * 0.02 + sin(u_time * 0.3) * 0.02);
            
            // Grid Repetition driven by Mids
            float grid = 5.0 - u_density; 
            z = mod(z + grid/2.0, grid) - grid/2.0;
            
            float scale = 1.0;
            float iterCount = 0.0;
            
            // Mids drive the rotation
            float foldAngle1 = (u_time * 0.08) * u_spin + (u_deform * 0.15);
            float foldAngle2 = (u_time * 0.04) * u_spin - (u_deform * 0.08);
            
            // 5 Iterations for a soft, ambient geometry
            for(int i = 0; i < 5; i++) { 
                // Bass (u_deform) gently swells the void spaces
                z = abs(z) - vec3(0.6 + u_deform * 0.1, 0.5, 0.4);
                
                z.xy *= rot(foldAngle1 + float(i) * 0.15);
                z.xz *= rot(foldAngle2);
                
                float k = 1.5;
                z *= k;
                scale *= k;
                
                iterCount += 1.0;
            }
            
            vec3 d = abs(z) - vec3(1.0);
            float dist = (min(max(d.x, max(d.y, d.z)), 0.0) + length(max(d, 0.0))) / scale;
            
            return vec2(dist, iterCount);
        }

        vec3 getNeonColor(vec3 p) {
            // Treble drives how fast the colors morph across the space
            float colorSeed = fract(p.x * 0.1 + p.z * 0.1 + u_time * u_hueSpeed * 0.15);
            
            if (colorSeed < 0.4) {
                return vec3(0.9, 0.4, 0.6); // Deep Soft Pink
            } else if (colorSeed < 0.8) {
                return vec3(0.3, 0.6, 0.9); // Deep Soft Blue
            } else {
                return vec3(0.7, 0.7, 0.8); // Dimmed White/Grey
            }
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            
            // Subtle aberration tied to Treble
            float split = u_glitch * 0.004;
            
            vec3 ro = vec3(0.0, 0.0, -2.5); 
            vec3 col = vec3(0.0);
            
            for (int c = 0; c < 3; c++) {
                vec2 suv = uv;
                if (c == 0) suv.x -= split; 
                if (c == 2) suv.x += split; 
                
                vec3 rd = normalize(vec3(suv, 1.0));
                
                float t = 0.0;
                float accumulatedGlow = 0.0;
                vec2 res;
                vec3 p;
                
                for(int i = 0; i < 60; i++) {
                    p = ro + rd * t;
                    res = map(p);
                    
                    if(res.x < 0.002 || t > 15.0) break;
                    
                    // Smooth, breathing glow instead of bright flashes
                    accumulatedGlow += (0.01 / (0.02 + res.x * res.x));
                    
                    t += res.x * 0.85; 
                }
                
                if(t < 15.0) {
                    // Deep fog
                    float fog = exp(-u_fog * t * t * 0.5); 
                    
                    vec3 neon = getNeonColor(p);
                    
                    float structLight = max(0.0, 1.0 - res.y * 0.1);
                    vec3 baseCol = vec3(0.02) * structLight; // Very dark base metal
                    
                    // Overall audio energy modulates the volumetric glow smoothly
                    float smoothGlow = accumulatedGlow * (0.02 + u_audio * 0.06);
                    baseCol += neon * smoothGlow;
                    
                    if (c == 0) col.r = (baseCol * fog).r;
                    else if (c == 1) col.g = (baseCol * fog).g;
                    else col.b = (baseCol * fog).b;
                }
            }
            
            // Soft cinematic vignette
            col *= 1.0 - dot(uv, uv) * 0.6;
            
            gl_FragColor = vec4(col, 1.0);
        }
    `;

    function compileShader(gl, source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl, vsSource, gl.VERTEX_SHADER));
    gl.attachShader(program, compileShader(gl, fsSource, gl.FRAGMENT_SHADER));
    gl.linkProgram(program);
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
        res: gl.getUniformLocation(program, "u_resolution"),
        time: gl.getUniformLocation(program, "u_time"),
        audio: gl.getUniformLocation(program, "u_audio"),
        hueSpeed: gl.getUniformLocation(program, "u_hueSpeed"),
        zoom: gl.getUniformLocation(program, "u_zoom"),
        density: gl.getUniformLocation(program, "u_density"),
        deform: gl.getUniformLocation(program, "u_deform"),
        fog: gl.getUniformLocation(program, "u_fog"),
        spin: gl.getUniformLocation(program, "u_spin"),
        glitch: gl.getUniformLocation(program, "u_glitch")
    };

    function resize() {
        glCanvas.width = window.innerWidth;
        glCanvas.height = window.innerHeight;
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    }
    window.addEventListener('resize', resize);
    resize();
    
    // --- RENDER LOOP ---
    function render(time) {
        if (!isRunning) return;
        requestAnimationFrame(render);
        
        analyser.getByteFrequencyData(dataArray);
        
        // --- FFT FREQUENCY BANDS ---
        let bassSum = 0, midSum = 0, trebleSum = 0, totalSum = 0;
        
        // Define ranges for 256 bins (analyser.frequencyBinCount)
        const bassEnd = 10;      // Low frequencies
        const midEnd = 120;      // Mid frequencies
        const trebleEnd = 250;   // High frequencies
        
        for (let i = 0; i < 256; i++) {
            let val = dataArray[i] / 255.0;
            totalSum += val;
            
            if (i < bassEnd) {
                bassSum += val;
            } else if (i < midEnd) {
                midSum += val;
            } else if (i < trebleEnd) {
                trebleSum += val;
            }
        }
        
        // Calculate raw averages
        let rawBass = bassSum / bassEnd;
        let rawMids = midSum / (midEnd - bassEnd);
        let rawTreble = trebleSum / (trebleEnd - midEnd);
        let rawEnergy = totalSum / 256;

        // --- SOFTWARE SMOOTHING ---
        // Apply secondary smoothing in JS for highly hypnotic, liquid movement
        smoothedBass = smoothedBass * 0.9 + rawBass * 0.1;
        smoothedMids = smoothedMids * 0.9 + rawMids * 0.1;
        smoothedTreble = smoothedTreble * 0.9 + rawTreble * 0.1;
        smoothedEnergy = smoothedEnergy * 0.9 + rawEnergy * 0.1;

        // --- DYNAMIC FFT PARAMETER MAPPING ---
        // Base values + Audio influence
        
        // Treble drives color morph speed and chromatic edges
        let dynHueSpeed = 0.5 + (smoothedTreble * 2.0);
        let dynGlitch   = smoothedTreble * 1.5;
        
        // Bass drives forward velocity and geometric swelling
        let dynZoom     = 0.2 + (smoothedBass * 1.2);
        let dynDeform   = smoothedBass * 2.5;
        
        // Mids drive rotation and structural complexity
        let dynSpin     = 0.5 + (smoothedMids * 1.5);
        let dynDensity  = 0.0 + (smoothedMids * 1.2);
        
        // Energy drives fog depth (heavy bass lifts the fog slightly)
        let dynFog      = 0.12 - (smoothedEnergy * 0.04);

        // --- SHADER UNIFORMS ---
        gl.uniform2f(uniforms.res, glCanvas.width, glCanvas.height);
        gl.uniform1f(uniforms.time, time * 0.001);
        gl.uniform1f(uniforms.audio, smoothedEnergy);
        
        gl.uniform1f(uniforms.hueSpeed, dynHueSpeed);
        gl.uniform1f(uniforms.zoom, dynZoom);
        gl.uniform1f(uniforms.density, dynDensity);
        gl.uniform1f(uniforms.deform, dynDeform);
        gl.uniform1f(uniforms.fog, dynFog);
        gl.uniform1f(uniforms.spin, dynSpin);
        gl.uniform1f(uniforms.glitch, dynGlitch);
        
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Magnetic Reactor</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030303;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE REACTOR ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // AUDIO ENVELOPE SMOOTHING (The secret to killing jitter)
    let envBass = 0, envMids = 0, envTreble = 0;
    
    // Attack: How fast it jumps to the beat (0.0 to 1.0)
    // Release: How slowly it falls back down (lower = smoother/floatier)
    const ATTACK = 0.25; 
    const RELEASE = 0.02; 

    function smoothAudio(current, target) {
        if (target > current) {
            return current + (target - current) * ATTACK; 
        } else {
            return current + (target - current) * RELEASE;
        }
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.8; 
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030303, 0.015);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 60);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x111111);
    scene.add(ambientLight);

    const pinkLight = new THREE.PointLight(0xffb6c1, 0, 150); // Soft Pink
    pinkLight.position.set(-20, 10, 20);
    scene.add(pinkLight);

    const blueLight = new THREE.PointLight(0xadd8e6, 0, 150); // Soft Blue
    blueLight.position.set(20, -10, -20);
    scene.add(blueLight);

    const whiteLight = new THREE.PointLight(0xffffff, 0, 100); // White core pulse
    whiteLight.position.set(0, 0, 0);
    scene.add(whiteLight);

    // --- 1. THE DARK CORE (Central Sphere) ---
    const coreGeo = new THREE.IcosahedronGeometry(12, 5); // Smooth high-poly sphere
    const coreMat = new THREE.MeshStandardMaterial({
        color: 0x050505, // Almost black
        metalness: 0.9,
        roughness: 0.2,
        flatShading: true // Gives it a slight industrial, faceted edge
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);

    // Save original vertices for smooth geometric pulsing
    const corePositions = coreGeo.attributes.position.clone();

    // --- 2. THE PARTICLE VORTEX ---
    const particleCount = 40000;
    const particlesGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    const colorArray = new Float32Array(particleCount * 3);

    // Generate a soft circular texture for the particles via canvas
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const particleTexture = new THREE.CanvasTexture(canvas);

    // Build the galaxy rings
    for (let i = 0; i < particleCount; i++) {
        // Distribute in a disc/torus shape
        let radius = 15 + Math.random() * 80;
        let theta = Math.random() * Math.PI * 2;
        // Y spread gets thinner further out
        let ySpread = (Math.random() - 0.5) * (1000 / radius); 

        posArray[i * 3] = Math.cos(theta) * radius;
        posArray[i * 3 + 1] = ySpread;
        posArray[i * 3 + 2] = Math.sin(theta) * radius;

        // Assign Colors: Soft Pink, Soft Blue, White
        let randColor = Math.random();
        if (randColor < 0.4) {
            // Soft Pink (255, 182, 193)
            colorArray[i*3] = 1.0; colorArray[i*3+1] = 0.71; colorArray[i*3+2] = 0.75;
        } else if (randColor < 0.8) {
            // Soft Blue (173, 216, 230)
            colorArray[i*3] = 0.67; colorArray[i*3+1] = 0.84; colorArray[i*3+2] = 0.90;
        } else {
            // White
            colorArray[i*3] = 1.0; colorArray[i*3+1] = 1.0; colorArray[i*3+2] = 1.0;
        }
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    const particlesMat = new THREE.PointsMaterial({
        size: 0.8,
        map: particleTexture,
        transparent: true,
        opacity: 0.8,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particleSystem = new THREE.Points(particlesGeo, particlesMat);
    
    // Tilt the vortex for a better cinematic angle
    particleSystem.rotation.x = 0.2;
    particleSystem.rotation.z = -0.1;
    scene.add(particleSystem);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // --- AUDIO PROCESSING ---
        analyser.getByteFrequencyData(dataArray);
        
        let bassSum = 0, midSum = 0, trebleSum = 0;
        const bassEnd = 15, midEnd = 120, trebleEnd = 255;   
        
        // Boost signal internally
        const audioBoost = 3.0; 
        
        for (let i = 0; i < 256; i++) {
            let val = Math.min(1.0, (dataArray[i] / 255.0) * audioBoost);
            if (i < bassEnd) bassSum += val;
            else if (i < midEnd) midSum += val;
            else if (i < trebleEnd) trebleSum += val;
        }
        
        let rawBass = bassSum / bassEnd;
        let rawMids = midSum / (midEnd - bassEnd);
        let rawTreble = trebleSum / (trebleEnd - midEnd);

        // APPLY ENVELOPE SMOOTHING (Kills the jitter)
        envBass = smoothAudio(envBass, rawBass);
        envMids = smoothAudio(envMids, rawMids);
        envTreble = smoothAudio(envTreble, rawTreble);

        // --- APPLY TO VISUALS ---

        // 1. Lighting Pulses (Driven by Bass & Treble)
        pinkLight.intensity = envBass * 5;
        blueLight.intensity = envBass * 5;
        whiteLight.intensity = envTreble * 3;

        // 2. Core Breathing & Deformation
        // The sphere expands with the bass, creating a heartbeat effect
        let coreScale = 1.0 + (envBass * 0.3);
        core.scale.set(coreScale, coreScale, coreScale);
        
        // Slowly rotate the core
        core.rotation.y = time * 0.2;
        core.rotation.x = time * 0.1;

        // Smoothly displace the core's vertices based on mids
        const pos = core.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let p = new THREE.Vector3().fromBufferAttribute(corePositions, i);
            
            // Generate a slow, smooth wave
            let wave = Math.sin(p.x * 0.5 + time) * Math.cos(p.z * 0.5 + time);
            
            // Mids push the vertices out, creating smooth ridges
            p.multiplyScalar(1.0 + (wave * envMids * 0.15));
            pos.setXYZ(i, p.x, p.y, p.z);
        }
        pos.needsUpdate = true;
        core.geometry.computeVertexNormals(); // Keeps shading smooth

        // 3. Particle Vortex Dynamics
        // Base rotation + extra speed from Mids
        particleSystem.rotation.y = (time * 0.05) + (envMids * 0.5);
        
        // Treble brightens and slightly enlarges the particles
        particlesMat.size = 0.6 + (envTreble * 1.5);
        particlesMat.opacity = 0.5 + (envTreble * 0.5);

        // 4. Cinematic Camera Drift
        camera.position.x = Math.sin(time * 0.1) * 15;
        camera.position.y = 15 + Math.sin(time * 0.2) * 5;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Reactive Particle Storm</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020202;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE PARTICLE STORM ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // We will pass the raw audio data array directly to the GPU shader via a texture
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Envelopes for global smooth movements
    let envBass = 0, envTreble = 0;
    const ATTACK = 0.3; 
    const RELEASE = 0.05; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.7; // Lower smoothing for punchier visual strikes
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020202, 0.012);
    
    // Higher camera angle to look down into the reactive crater
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 45, 75);
    camera.lookAt(0, -10, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- GENERATE PARTICLE TEXTURE ---
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const particleTexture = new THREE.CanvasTexture(canvas);

    // --- SETUP AUDIO DATA TEXTURE FOR SHADER ---
    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; // Smooth blending between frequencies
    audioTexture.minFilter = THREE.LinearFilter;

    // --- 60,000 REACTIVE PARTICLES ---
    const particleCount = 60000;
    const particlesGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    const colorArray = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        // Distribute in a massive disc, packed tighter in the center
        let radius = 2 + Math.sqrt(Math.random()) * 85; 
        let theta = Math.random() * Math.PI * 2;
        let y = (Math.random() - 0.5) * 1.5; 

        posArray[i * 3] = Math.cos(theta) * radius;
        posArray[i * 3 + 1] = y;
        posArray[i * 3 + 2] = Math.sin(theta) * radius;

        // Colors: Soft Pink, Soft Blue, White
        let randColor = Math.random();
        if (randColor < 0.4) {
            colorArray[i*3] = 1.0; colorArray[i*3+1] = 0.6; colorArray[i*3+2] = 0.75; // Soft Pink
        } else if (randColor < 0.8) {
            colorArray[i*3] = 0.5; colorArray[i*3+1] = 0.8; colorArray[i*3+2] = 1.0; // Soft Blue
        } else {
            colorArray[i*3] = 0.9; colorArray[i*3+1] = 0.9; colorArray[i*3+2] = 1.0; // Soft White
        }
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    // --- CUSTOM GPU SHADER MATERIAL ---
    const customUniforms = {
        uTime: { value: 0 },
        uAudioTex: { value: audioTexture },
        uPointTex: { value: particleTexture },
        uBass: { value: 0 },
        uTreble: { value: 0 }
    };

    const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: customUniforms,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            uniform float uTime;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uTreble;

            varying vec3 vColor;
            varying float vAudioIntensity;

            void main() {
                vColor = color;
                vec3 pos = position;

                // 1. Map particle distance to audio frequency bin
                float dist = length(pos.xz);
                float normalizedDist = clamp((dist - 2.0) / 85.0, 0.0, 1.0);
                
                // Read the exact frequency volume for this specific particle
                // Curve the read so bass covers the middle, treble covers the outside rings
                float audioVal = texture2D(uAudioTex, vec2(pow(normalizedDist, 0.8), 0.5)).r;
                vAudioIntensity = audioVal;

                // 2. Physical Audio Displacement
                // Bass erupts the center vertically
                float centerLift = exp(-normalizedDist * 5.0) * audioVal * 40.0;
                
                // Mids/Treble create cymatic liquid ripples across the rings
                float ripple = sin(dist * 0.4 - uTime * 6.0) * (audioVal * 15.0 * (1.0 - normalizedDist));
                
                pos.y += centerLift + ripple;

                // 3. Audio Shockwave Expansion
                // Bass physically pushes the particles outward from the center
                float expansion = 1.0 + (uBass * 0.4 * exp(-normalizedDist * 2.0));
                pos.x *= expansion;
                pos.z *= expansion;

                // 4. Vortex Rotation
                float angle = atan(pos.z, pos.x);
                float currentRadius = length(pos.xz);
                
                // Center spins faster, edges spin slower. Bass speeds it all up.
                angle += (uTime * 0.2) + (uBass * 1.5) * (1.0 / (normalizedDist + 0.5));
                
                pos.x = cos(angle) * currentRadius;
                pos.z = sin(angle) * currentRadius;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                
                // Particle size scales drastically with its audio intensity
                float pSize = 1.0 + (audioVal * 6.0) + (uTreble * 3.0);
                gl_PointSize = pSize * (150.0 / -mvPosition.z);
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform sampler2D uPointTex;
            varying vec3 vColor;
            varying float vAudioIntensity;

            void main() {
                vec4 texColor = texture2D(uPointTex, gl_PointCoord);
                
                // Particles glow bright white/core-color when hit by audio
                vec3 finalColor = mix(vColor, vec3(1.0), vAudioIntensity * 0.6);
                finalColor *= (0.5 + vAudioIntensity * 2.0);
                
                gl_FragColor = vec4(finalColor, texColor.a * (0.3 + vAudioIntensity * 0.7));
            }
        `
    });

    const particleSystem = new THREE.Points(particlesGeo, shaderMaterial);
    
    // Tilt the entire system slightly to favor the camera
    particleSystem.rotation.x = 0.1;
    scene.add(particleSystem);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // 1. Get raw audio data and push it straight to the GPU texture
        analyser.getByteFrequencyData(dataArray);
        
        // Boost the raw signal slightly so it reacts well even to quiet music
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 1.8);
        }
        audioTexture.needsUpdate = true; // Crucial: Tells GPU to refresh the texture

        // 2. Calculate smooth global envelopes for camera & macro effects
        let bassSum = 0, trebleSum = 0;
        for (let i = 0; i < 15; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 15;
        let rawTreble = trebleSum / 105;

        envBass = smoothAudio(envBass, rawBass * 1.5);
        envTreble = smoothAudio(envTreble, rawTreble * 1.5);

        // Update Shader Uniforms
        customUniforms.uTime.value = time;
        customUniforms.uBass.value = envBass;
        customUniforms.uTreble.value = envTreble;

        // Cinematic Camera Pan
        camera.position.x = Math.sin(time * 0.2) * 20;
        camera.position.z = 70 + Math.cos(time * 0.15) * 15;
        // Bass drops lower the camera into the particle field
        camera.position.y = 40 - (envBass * 15); 
        camera.lookAt(0, 5, 0);

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

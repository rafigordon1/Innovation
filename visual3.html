<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Organic Abyss</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let smoothedEnergy = 0;
    let isRunning = false;
    let audioInitialized = false;
    
    let lastTapTime = 0;
    let bpmInterval = 500; 
    let shockwaveRadius = 0;
    let shockwaveActive = false;

    // Advanced Rate of Change Engine
    const keyState = {
        '1': { lastPress: 0, delta: 3000 }, 
        '2': { lastPress: 0, delta: 3000 }, 
        '3': { lastPress: 0, delta: 3000 }, 
        '4': { lastPress: 0, delta: 3000 }, 
        '5': { lastPress: 0, delta: 3000 }, 
        '6': { lastPress: 0, delta: 3000 }, 
        'ArrowLeft': { lastPress: 0, delta: 3000 } 
    };

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85; 
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
        } catch (err) {
            console.warn("Microphone access pending or denied.", err);
        }
    }
    window.addEventListener('load', initAudio);

    // --- INPUT LOGIC ---
    function updateRate(key) {
        const now = performance.now();
        const state = keyState[key];
        if (state.lastPress > 0) {
            let d = now - state.lastPress;
            // Adjusted weighting: Reacts much faster to sudden changes in tapping speed
            if (d < 4000) state.delta = (state.delta * 0.15) + (d * 0.85); 
        }
        state.lastPress = now;
    }

    // Applying a slight power curve so extreme fast values trigger more aggressively
    function mapDelta(delta, fastVal, slowVal) {
        let clamped = Math.max(50, Math.min(4000, delta));
        let t = (clamped - 50) / (3950); 
        t = Math.pow(t, 1.5); // Curves the response for more impact
        return fastVal + t * (slowVal - fastVal);
    }

    window.addEventListener('keydown', async (e) => {
        if (!audioInitialized) await initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            await audioContext.resume();
            isRunning = true;
        }

        if (!isRunning) return;

        if (keyState[e.key] !== undefined) {
            updateRate(e.key);
        } else if (e.key === 'ArrowRight') {
            const now = performance.now();
            if (lastTapTime > 0 && (now - lastTapTime) < 2000) {
                bpmInterval = now - lastTapTime;
            }
            lastTapTime = now;
            shockwaveRadius = 0; 
            shockwaveActive = true;
        } else if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- ORGANIC NOISE FUNCTION ---
    function fbm(x, y, t, scale) {
        let value = 0;
        let amp = 1.0;
        let freq = scale;
        for (let i = 0; i < 3; i++) {
            value += Math.sin(x * freq + t) * Math.cos(y * freq - t) * amp;
            x += 1.5; y -= 1.5; 
            amp *= 0.5;
            freq *= 2.0;
        }
        return value;
    }

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020204, 0.02);
    
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(0, 15, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x111122); 
    scene.add(ambientLight);

    const light1 = new THREE.PointLight(0xffb6c1, 4, 150); 
    light1.position.set(-15, 15, 10);
    scene.add(light1);
    
    const light2 = new THREE.PointLight(0xadd8e6, 4, 150); 
    light2.position.set(15, 15, -10);
    scene.add(light2);

    const coreLight = new THREE.PointLight(0xffffff, 2, 100); 
    coreLight.position.set(0, 10, 0);
    scene.add(coreLight);

    const planeSize = 140; // Extended slightly for wider camera pans
    const planeResolution = 140; 
    const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize, planeResolution, planeResolution);
    
    planeGeo.rotateX(-Math.PI / 2);
    
    const planeMat = new THREE.MeshPhysicalMaterial({
        color: 0x050508,
        metalness: 0.9,
        roughness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        wireframe: false,
        side: THREE.DoubleSide
    });
    
    const fluidMesh = new THREE.Mesh(planeGeo, planeMat);
    scene.add(fluidMesh);
    
    const positionAttribute = planeGeo.attributes.position;
    const originalPositions = new Float32Array(positionAttribute.count * 3);
    for (let i = 0; i < positionAttribute.count * 3; i++) {
        originalPositions[i] = positionAttribute.array[i];
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let j = 0; j < dataArray.length; j++) sum += dataArray[j];
        let rawEnergy = sum / dataArray.length / 255;
        smoothedEnergy = smoothedEnergy * 0.85 + rawEnergy * 0.15;

        // --- MASSIVELY EXPANDED DYNAMIC PARAMETERS ---
        // Fast values are much higher, slow values are almost zero
        let dynHueSpeed  = mapDelta(keyState['1'].delta, 12.0, 0.05); // Rapid psychedelic vs glacial shift
        let dynCamPan    = mapDelta(keyState['2'].delta, 80.0, 2.0);  // Extreme dizzying sweeps vs gentle sway
        let dynViscosity = mapDelta(keyState['3'].delta, 0.8, 0.02);  // High frequency detailed flesh vs smooth rolling hills
        let dynDeform    = mapDelta(keyState['4'].delta, 65.0, 1.0);  // Violent massive spikes vs tiny ripples
        let dynFog       = mapDelta(keyState['5'].delta, 0.15, 0.005); // Pitch black claustrophobia vs vast clear cavern
        let dynSpeed     = mapDelta(keyState['6'].delta, 15.0, 0.05); // Rushing violent rapids vs creeping sludge
        let dynAgitation = mapDelta(keyState['ArrowLeft'].delta, 12.0, 0.0); // Intense shaking/glitch vs completely smooth

        scene.fog.density = dynFog;
        
        const hue1 = (time * dynHueSpeed * 0.1) % 1;
        const hue2 = (hue1 + 0.5) % 1;
        light1.color.setHSL(hue1, 0.8, 0.5);
        light2.color.setHSL(hue2, 0.8, 0.5);
        
        light1.intensity = 2 + (smoothedEnergy * 15);
        light2.intensity = 2 + (smoothedEnergy * 15);
        coreLight.intensity = (smoothedEnergy * 25);
        
        light1.position.x = Math.sin(time * 0.5 * dynSpeed) * 30;
        light1.position.z = Math.cos(time * 0.5 * dynSpeed) * 30;
        light2.position.x = Math.sin(time * -0.3 * dynSpeed) * 30;
        light2.position.z = Math.cos(time * -0.3 * dynSpeed) * 30;

        camera.position.x = Math.sin(time * 0.2) * dynCamPan;
        camera.position.y = 12 + Math.cos(time * 0.3) * (dynCamPan * 0.4) - (smoothedEnergy * 8);
        camera.position.z = 45 + Math.sin(time * 0.1) * (dynCamPan * 0.6);
        camera.lookAt(0, 0, 0);

        if (shockwaveActive) {
            shockwaveRadius += 2.0 + (dynSpeed * 0.5);
            if (shockwaveRadius > 150) shockwaveActive = false;
        }

        const pos = fluidMesh.geometry.attributes.position;
        
        for (let i = 0; i < pos.count; i++) {
            let x = originalPositions[i * 3];
            let z = originalPositions[i * 3 + 2];
            
            let dist = Math.sqrt(x*x + z*z);
            let fluidMotion = fbm(x, z, time * dynSpeed, dynViscosity);
            
            let freqIndex = Math.floor(dist * 1.5) % 128; 
            let audioBoost = (dataArray[freqIndex] / 255.0);
            
            let jitter = (Math.random() - 0.5) * dynAgitation * audioBoost;
            
            // Scaled fluid motion slightly higher to match extreme bounds
            let y = (fluidMotion * 6.0) + (audioBoost * dynDeform) + jitter;

            if (shockwaveActive) {
                let waveDist = Math.abs(dist - shockwaveRadius);
                if (waveDist < 8) {
                    y += Math.sin((1 - waveDist/8) * Math.PI) * 15;
                }
            }

            pos.setY(i, y);
        }

        pos.needsUpdate = true;
        fluidMesh.geometry.computeVertexNormals();

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

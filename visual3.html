<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Hypnotic KIFS Cavern</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let smoothedEnergy = 0;
    let isRunning = false;
    let audioInitialized = false;

    // Advanced Rate of Change Engine (Delta in ms)
    const keyState = {
        '1': { lastPress: 0, delta: 3000 }, // Hue Shift
        '2': { lastPress: 0, delta: 3000 }, // Forward Velocity
        '3': { lastPress: 0, delta: 3000 }, // Grid Spacing
        '4': { lastPress: 0, delta: 3000 }, // Audio Swell (Deform)
        '5': { lastPress: 0, delta: 3000 }, // Fog Density
        '6': { lastPress: 0, delta: 3000 }, // Gentle Spin
        'ArrowLeft': { lastPress: 0, delta: 3000 } // Subtle Chromatic Shift
    };

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            // Extremely high smoothing (0.92) to prevent flashing/twitching
            analyser.smoothingTimeConstant = 0.92; 
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            audioInitialized = true;
            if (audioContext.state === 'running') {
                isRunning = true;
                requestAnimationFrame(render);
            }
        } catch (err) {
            console.warn("Microphone access pending or denied.", err);
        }
    }
    window.addEventListener('load', initAudio);

    // --- INPUT LOGIC ---
    function updateRate(key) {
        const now = performance.now();
        const state = keyState[key];
        if (state.lastPress > 0) {
            let d = now - state.lastPress;
            if (d < 4000) state.delta = (state.delta * 0.2) + (d * 0.8); 
        }
        state.lastPress = now;
    }

    function mapDelta(delta, fastVal, slowVal) {
        let clamped = Math.max(100, Math.min(3000, delta));
        let t = (clamped - 100) / (2900); 
        return fastVal + t * (slowVal - fastVal);
    }

    window.addEventListener('keydown', async (e) => {
        if (!audioInitialized) await initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            await audioContext.resume();
            isRunning = true;
            requestAnimationFrame(render);
        }

        if (!isRunning) return;

        if (keyState[e.key] !== undefined) {
            updateRate(e.key);
        } else if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- WEBGL HYPNOTIC FRACTAL SHADER ---
    const glCanvas = document.getElementById('webgl-canvas');
    const gl = glCanvas.getContext('webgl', { alpha: false, antialias: false });

    const vsSource = `
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const fsSource = `
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_audio;
        
        // Dynamic Params
        uniform float u_hueSpeed;
        uniform float u_zoom;
        uniform float u_density;
        uniform float u_deform;
        uniform float u_fog;
        uniform float u_spin;
        uniform float u_glitch;

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        vec2 map(vec3 p) {
            vec3 z = p;
            
            // Slow, creeping forward motion
            z.z -= u_time * (0.2 + u_zoom);
            
            // Very gentle spatial twist
            z.xy *= rot(z.z * u_glitch * 0.02 + sin(u_time * 0.5) * 0.02);
            
            // Infinite Grid Repetition (spaced out so it feels massive, not cluttered)
            float grid = 5.0 - u_density; 
            z = mod(z + grid/2.0, grid) - grid/2.0;
            
            float scale = 1.0;
            float iterCount = 0.0;
            
            // Smooth, fluid folding angles
            float foldAngle1 = (u_time * 0.1) * u_spin + (u_audio * u_deform * 0.2);
            float foldAngle2 = (u_time * 0.05) * u_spin - (u_audio * u_deform * 0.1);
            
            for(int i = 0; i < 5; i++) { // Reduced iterations for softer geometry
                // Audio gently swells the void spaces rather than tearing them
                z = abs(z) - vec3(0.6 + u_audio * u_deform * 0.1, 0.5, 0.4);
                
                z.xy *= rot(foldAngle1 + float(i) * 0.15);
                z.xz *= rot(foldAngle2);
                
                float k = 1.5;
                z *= k;
                scale *= k;
                
                iterCount += 1.0;
            }
            
            vec3 d = abs(z) - vec3(1.0);
            float dist = (min(max(d.x, max(d.y, d.z)), 0.0) + length(max(d, 0.0))) / scale;
            
            return vec2(dist, iterCount);
        }

        vec3 getNeonColor(vec3 p) {
            float colorSeed = fract(p.x * 0.1 + p.z * 0.1 + u_time * u_hueSpeed * 0.2);
            
            // Deeper, richer tones of soft pink and blue. Reduced pure white.
            if (colorSeed < 0.4) {
                return vec3(0.9, 0.4, 0.6); // Deep Soft Pink
            } else if (colorSeed < 0.8) {
                return vec3(0.3, 0.6, 0.9); // Deep Soft Blue
            } else {
                return vec3(0.7, 0.7, 0.8); // Dimmed White/Grey
            }
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            
            // Subtle aberration
            float split = u_glitch * 0.003;
            
            vec3 ro = vec3(0.0, 0.0, -2.5); 
            vec3 col = vec3(0.0);
            
            for (int c = 0; c < 3; c++) {
                vec2 suv = uv;
                if (c == 0) suv.x -= split; 
                if (c == 2) suv.x += split; 
                
                vec3 rd = normalize(vec3(suv, 1.0));
                
                float t = 0.0;
                float accumulatedGlow = 0.0;
                vec2 res;
                vec3 p;
                
                for(int i = 0; i < 60; i++) {
                    p = ro + rd * t;
                    res = map(p);
                    
                    if(res.x < 0.002 || t > 15.0) break;
                    
                    // Smooth, breathing glow instead of bright flashes
                    accumulatedGlow += (0.01 / (0.02 + res.x * res.x));
                    
                    t += res.x * 0.85; 
                }
                
                if(t < 15.0) {
                    // Heavy, oppressive fog to hide jarring details
                    float fog = exp(-u_fog * t * t * 0.5); 
                    
                    vec3 neon = getNeonColor(p);
                    
                    float structLight = max(0.0, 1.0 - res.y * 0.1);
                    vec3 baseCol = vec3(0.02) * structLight; // Very dark base metal
                    
                    // Audio modulates the volumetric glow smoothly
                    float smoothGlow = accumulatedGlow * (0.02 + u_audio * 0.05);
                    baseCol += neon * smoothGlow;
                    
                    if (c == 0) col.r = (baseCol * fog).r;
                    else if (c == 1) col.g = (baseCol * fog).g;
                    else col.b = (baseCol * fog).b;
                }
            }
            
            // Soft cinematic vignette
            col *= 1.0 - dot(uv, uv) * 0.6;
            
            gl_FragColor = vec4(col, 1.0);
        }
    `;

    function compileShader(gl, source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl, vsSource, gl.VERTEX_SHADER));
    gl.attachShader(program, compileShader(gl, fsSource, gl.FRAGMENT_SHADER));
    gl.linkProgram(program);
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
        res: gl.getUniformLocation(program, "u_resolution"),
        time: gl.getUniformLocation(program, "u_time"),
        audio: gl.getUniformLocation(program, "u_audio"),
        hueSpeed: gl.getUniformLocation(program, "u_hueSpeed"),
        zoom: gl.getUniformLocation(program, "u_zoom"),
        density: gl.getUniformLocation(program, "u_density"),
        deform: gl.getUniformLocation(program, "u_deform"),
        fog: gl.getUniformLocation(program, "u_fog"),
        spin: gl.getUniformLocation(program, "u_spin"),
        glitch: gl.getUniformLocation(program, "u_glitch")
    };

    function resize() {
        glCanvas.width = window.innerWidth;
        glCanvas.height = window.innerHeight;
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    }
    window.addEventListener('resize', resize);
    resize();
    
    // --- RENDER LOOP ---
    function render(time) {
        if (!isRunning) return;
        requestAnimationFrame(render);
        
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let rawEnergy = sum / dataArray.length / 255;
        // Exceptionally smooth interpolation
        smoothedEnergy = smoothedEnergy * 0.9 + rawEnergy * 0.1;

        // Capped, elegant parameter ranges (No chaotic extremes)
        let dynHueSpeed = mapDelta(keyState['1'].delta, 1.0, 0.05);   // Smooth morph
        let dynZoom     = mapDelta(keyState['2'].delta, 2.5, 0.1);    // Gentle float
        let dynDensity  = mapDelta(keyState['3'].delta, 1.0, 0.0);    // Moderate spacing
        let dynDeform   = mapDelta(keyState['4'].delta, 1.5, 0.0);    // Soft structural breathing
        let dynFog      = mapDelta(keyState['5'].delta, 0.15, 0.05);  // Always dark and deep
        let dynSpin     = mapDelta(keyState['6'].delta, 1.0, 0.1);    // Hypnotic turning
        let dynGlitch   = mapDelta(keyState['ArrowLeft'].delta, 1.0, 0.0); // Very mild edge split

        gl.uniform2f(uniforms.res, glCanvas.width, glCanvas.height);
        gl.uniform1f(uniforms.time, time * 0.001);
        gl.uniform1f(uniforms.audio, smoothedEnergy);
        
        gl.uniform1f(uniforms.hueSpeed, dynHueSpeed);
        gl.uniform1f(uniforms.zoom, dynZoom);
        gl.uniform1f(uniforms.density, dynDensity);
        gl.uniform1f(uniforms.deform, dynDeform);
        gl.uniform1f(uniforms.fog, dynFog);
        gl.uniform1f(uniforms.spin, dynSpin);
        gl.uniform1f(uniforms.glitch, dynGlitch);
        
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
</script>
</body>
</html>

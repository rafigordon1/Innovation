<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Organic Abyss</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let smoothedEnergy = 0;
    let isRunning = false;
    let audioInitialized = false;
    
    // BPM / Shockwave state
    let lastTapTime = 0;
    let bpmInterval = 500; 
    let shockwaveRadius = 0;
    let shockwaveActive = false;

    // Advanced Rate of Change Engine (Delta in ms)
    const keyState = {
        '1': { lastPress: 0, delta: 3000 }, // Hue Shift Speed
        '2': { lastPress: 0, delta: 3000 }, // Camera Sway/Height
        '3': { lastPress: 0, delta: 3000 }, // Organic Viscosity (Noise Scale)
        '4': { lastPress: 0, delta: 3000 }, // Audio Wave Deformation
        '5': { lastPress: 0, delta: 3000 }, // Fog/Abyss Depth
        '6': { lastPress: 0, delta: 3000 }, // Liquid Flow Speed
        'ArrowLeft': { lastPress: 0, delta: 3000 } // Agitation / Glitch
    };

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85; 
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
        } catch (err) {
            console.warn("Microphone access pending or denied.", err);
        }
    }
    window.addEventListener('load', initAudio);

    // --- INPUT LOGIC ---
    function updateRate(key) {
        const now = performance.now();
        const state = keyState[key];
        if (state.lastPress > 0) {
            let d = now - state.lastPress;
            if (d < 4000) state.delta = (state.delta * 0.3) + (d * 0.7); 
        }
        state.lastPress = now;
    }

    function mapDelta(delta, fastVal, slowVal) {
        let clamped = Math.max(50, Math.min(4000, delta));
        let t = (clamped - 50) / (4000 - 50); 
        return fastVal + t * (slowVal - fastVal);
    }

    window.addEventListener('keydown', async (e) => {
        if (!audioInitialized) await initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            await audioContext.resume();
            isRunning = true;
        }

        if (!isRunning) return;

        if (keyState[e.key] !== undefined) {
            updateRate(e.key);
        } else if (e.key === 'ArrowRight') {
            const now = performance.now();
            if (lastTapTime > 0 && (now - lastTapTime) < 2000) {
                bpmInterval = now - lastTapTime;
            }
            lastTapTime = now;
            shockwaveRadius = 0; 
            shockwaveActive = true;
        } else if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- ORGANIC NOISE FUNCTION ---
    // Minimalist Fractal Brownian Motion for fluid/flesh-like displacement
    function fbm(x, y, t, scale) {
        let value = 0;
        let amp = 1.0;
        let freq = scale;
        for (let i = 0; i < 3; i++) {
            value += Math.sin(x * freq + t) * Math.cos(y * freq - t) * amp;
            x += 1.5; y -= 1.5; 
            amp *= 0.5;
            freq *= 2.0;
        }
        return value;
    }

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    
    // Deep, oppressive fog
    scene.fog = new THREE.FogExp2(0x020204, 0.02);
    
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 15, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x111122); 
    scene.add(ambientLight);

    // Wandering spotlights to highlight the organic wetness
    const light1 = new THREE.PointLight(0xffb6c1, 4, 100); // Soft Pink
    light1.position.set(-15, 15, 10);
    scene.add(light1);
    
    const light2 = new THREE.PointLight(0xadd8e6, 4, 100); // Soft Blue
    light2.position.set(15, 15, -10);
    scene.add(light2);

    const coreLight = new THREE.PointLight(0xffffff, 2, 80); // White pulse
    coreLight.position.set(0, 10, 0);
    scene.add(coreLight);

    // --- ORGANIC LIQUID TERRAIN ---
    // High-resolution plane to allow fluid vertex manipulation
    const planeSize = 120;
    const planeResolution = 128; // 16k vertices
    const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize, planeResolution, planeResolution);
    
    // Rotate to lay flat
    planeGeo.rotateX(-Math.PI / 2);
    
    // MeshPhysicalMaterial creates a wet, organic, glossy look
    const planeMat = new THREE.MeshPhysicalMaterial({
        color: 0x050508,
        metalness: 0.8,
        roughness: 0.15,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        wireframe: false,
        side: THREE.DoubleSide
    });
    
    const fluidMesh = new THREE.Mesh(planeGeo, planeMat);
    scene.add(fluidMesh);
    
    // Store original Y positions to calculate displacement cleanly
    const positionAttribute = planeGeo.attributes.position;
    const originalPositions = new Float32Array(positionAttribute.count * 3);
    for (let i = 0; i < positionAttribute.count * 3; i++) {
        originalPositions[i] = positionAttribute.array[i];
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // Audio Analysis
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let j = 0; j < dataArray.length; j++) sum += dataArray[j];
        let rawEnergy = sum / dataArray.length / 255;
        smoothedEnergy = smoothedEnergy * 0.85 + rawEnergy * 0.15;

        // Dynamic Mappings from Key Delta Engine
        let dynHueSpeed  = mapDelta(keyState['1'].delta, 3.0, 0.1);
        let dynCamPan    = mapDelta(keyState['2'].delta, 30.0, 5.0); 
        let dynViscosity = mapDelta(keyState['3'].delta, 0.2, 0.05); // Noise scale
        let dynDeform    = mapDelta(keyState['4'].delta, 18.0, 2.0); 
        let dynFog       = mapDelta(keyState['5'].delta, 0.05, 0.01); 
        let dynSpeed     = mapDelta(keyState['6'].delta, 3.0, 0.2);
        let dynAgitation = mapDelta(keyState['ArrowLeft'].delta, 2.0, 0.0);

        // Update Fog & Lighting
        scene.fog.density = dynFog;
        
        // Fluid Color Shift
        const hue1 = (time * dynHueSpeed * 0.1) % 1;
        const hue2 = (hue1 + 0.5) % 1;
        light1.color.setHSL(hue1, 0.7, 0.5);
        light2.color.setHSL(hue2, 0.7, 0.5);
        
        // Intensity reacts to audio
        light1.intensity = 2 + (smoothedEnergy * 8);
        light2.intensity = 2 + (smoothedEnergy * 8);
        coreLight.intensity = (smoothedEnergy * 15);
        
        // Orbiting lights for dynamic organic specular highlights
        light1.position.x = Math.sin(time * 0.5) * 20;
        light1.position.z = Math.cos(time * 0.5) * 20;
        light2.position.x = Math.sin(time * -0.3) * 20;
        light2.position.z = Math.cos(time * -0.3) * 20;

        // Camera Sway (Hovering over the liquid)
        camera.position.x = Math.sin(time * 0.2) * dynCamPan;
        camera.position.y = 10 + Math.cos(time * 0.3) * (dynCamPan * 0.3) - (smoothedEnergy * 5);
        camera.position.z = 40 + Math.sin(time * 0.1) * (dynCamPan * 0.5);
        camera.lookAt(0, 0, 0);

        // Shockwave Logic
        if (shockwaveActive) {
            shockwaveRadius += 1.0 + (dynSpeed * 0.5);
            if (shockwaveRadius > 100) shockwaveActive = false;
        }

        // --- MANIPULATE THE ORGANIC TERRAIN ---
        const pos = fluidMesh.geometry.attributes.position;
        
        for (let i = 0; i < pos.count; i++) {
            // Get original X and Z to calculate stable noise
            let x = originalPositions[i * 3];
            let z = originalPositions[i * 3 + 2];
            
            // Calculate distance from center for audio mapping
            let dist = Math.sqrt(x*x + z*z);
            
            // Organic fluid noise
            let fluidMotion = fbm(x, z, time * dynSpeed, dynViscosity);
            
            // Audio mapping: map distance to frequency bin. 
            // We scale distance so it maps nicely to the 0-128 useful frequency range.
            let freqIndex = Math.floor(dist * 1.5) % 128; 
            let audioBoost = (dataArray[freqIndex] / 255.0);
            
            // High agitation introduces micro-jitters
            let jitter = (Math.random() - 0.5) * dynAgitation * audioBoost;
            
            // Combine noise and audio for final height (Y axis)
            let y = (fluidMotion * 4.0) + (audioBoost * dynDeform) + jitter;

            // Apply Shockwave Ripple
            if (shockwaveActive) {
                let waveDist = Math.abs(dist - shockwaveRadius);
                if (waveDist < 5) {
                    y += Math.sin((1 - waveDist/5) * Math.PI) * 10;
                }
            }

            pos.setY(i, y);
        }

        // Crucial: Tell Three.js the vertices changed, and recompute normals so lighting bounces correctly
        pos.needsUpdate = true;
        fluidMesh.geometry.computeVertexNormals();

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

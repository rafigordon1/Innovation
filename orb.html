<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum Volumetric Glass Orb</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Transparent background for perfect floating projection */
      background-color: transparent; 
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    let quantumShader;

    const vertShader = `
      attribute vec3 aPosition;
      varying vec2 vUv;
      void main() {
        vUv = aPosition.xy * 0.5 + 0.5;
        vUv.y = 1.0 - vUv.y; 
        gl_Position = vec4(aPosition, 1.0);
      }
    `;

    // The Ultimate Volumetric Fragment Shader
    const fragShader = `
      precision highp float;

      varying vec2 vUv;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;

      // 2D Rotation
      mat2 rot(float a) {
          float s = sin(a), c = cos(a);
          return mat2(c, -s, s, c);
      }

      // Cosine Palette for quantum plasma colors
      vec3 palette( in float t ) {
          vec3 a = vec3(0.5, 0.5, 0.5);
          vec3 b = vec3(0.5, 0.5, 0.5);
          vec3 c = vec3(1.0, 1.0, 1.0);
          vec3 d = vec3(0.263, 0.416, 0.557);
          return a + b * cos( 6.28318 * (c * t + d) );
      }

      // ACES Filmic Tone Mapping for cinematic color grading
      vec3 ACESFilm(vec3 x) {
          float a = 2.51;
          float b = 0.03;
          float c = 2.43;
          float d = 0.59;
          float e = 0.14;
          return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
      }

      void main() {
          vec2 uv = (vUv - 0.5) * 2.0;
          uv.x *= u_resolution.x / u_resolution.y;

          vec2 m = u_mouse * 2.0 - 1.0;
          m.x *= u_resolution.x / u_resolution.y;

          // Camera setup
          vec3 ro = vec3(sin(m.x)*3.0, m.y * 2.0, cos(m.x)*3.0); 
          vec3 target = vec3(0.0);
          vec3 z = normalize(target - ro);
          vec3 x = normalize(cross(vec3(0.0, 1.0, 0.0), z));
          vec3 y = cross(z, x);
          vec3 rd = normalize(uv.x * x + uv.y * y + 2.0 * z);

          // Analytic Sphere Intersection (Exact mathematics, infinite detail)
          float sphereRadius = 1.6;
          float b_intersect = dot(ro, rd);
          float c_intersect = dot(ro, ro) - sphereRadius * sphereRadius;
          float h = b_intersect * b_intersect - c_intersect;

          vec4 finalColor = vec4(0.0); // Default transparent background

          if (h > 0.0) {
              h = sqrt(h);
              float tEnter = -b_intersect - h;
              float tExit = -b_intersect + h;

              // Ensure camera is outside the orb
              if(tEnter > 0.0) {
                  // --- SHELL BOUNDARY CALCULATIONS ---
                  vec3 pEnter = ro + rd * tEnter;
                  vec3 n = normalize(pEnter);
                  vec3 view = -rd;

                  // Refraction Vector (Bending light into the glass)
                  // 1.0 (Air) to 1.35 (Quantum Glass)
                  vec3 refrDir = refract(rd, n, 1.0 / 1.35);

                  // Surface Lighting
                  vec3 lightDir = normalize(vec3(1.0, 3.0, 2.0));
                  vec3 refDir = reflect(rd, n);
                  
                  // Intense Specular Highlight
                  float spec = pow(max(dot(refDir, lightDir), 0.0), 128.0) * 1.5;
                  
                  // Fresnel Effect for glowing rims
                  float fresnel = pow(1.0 - max(dot(n, view), 0.0), 3.5);

                  // --- VOLUMETRIC MARCHING (THE CORE) ---
                  int steps = 50; // High sample count for extreme fidelity
                  float stepSize = (tExit - tEnter) / float(steps);
                  
                  vec3 volColor = vec3(0.0);
                  float transmittance = 1.0; // Starts at 100% light

                  for(int i = 0; i < 50; i++) {
                      // March along the REFRACTED ray, inside the orb
                      vec3 p = pEnter + refrDir * (float(i) * stepSize);

                      // Morphing the internal space (4D rotation)
                      p.xy *= rot(u_time * 0.15);
                      p.xz *= rot(u_time * 0.2);

                      // High-frequency Gyroid Field for plasma turbulence
                      float scale = 3.0;
                      float d = abs(dot(sin(p * scale), cos(p.yzx * scale)));
                      d = smoothstep(0.0, 0.4, d); // Isolate the dense energy filaments

                      // Color based on spatial location, time, and filament density
                      vec3 emit = palette(d * 1.5 + u_time * 0.5 + length(p));

                      // Calculate optical density at this point
                      float density = (1.0 - d) * 0.4;
                      
                      // Additive light emission attenuated by how much gas we've passed through
                      volColor += emit * density * transmittance;
                      
                      // Beer-Lambert Law: Light exponential decay
                      transmittance *= exp(-density * stepSize * 8.0);

                      // Early exit if the gas becomes completely opaque
                      if(transmittance < 0.01) break;
                  }

                  // Combine Volumetric Plasma + Shell Specular + Shell Fresnel
                  vec3 shellColor = (spec * vec3(1.0)) + (fresnel * palette(u_time * 0.2));
                  vec3 color = volColor * 1.5 + shellColor; // Boost internal glow

                  // Apply ACES Tonemapping for photorealism
                  color = ACESFilm(color);

                  // Edge Alpha: Smoothly fade the very edge to prevent jagged clipping
                  float edgeAlpha = smoothstep(0.0, 0.2, max(dot(n, view), 0.0));

                  finalColor = vec4(color, edgeAlpha);
              }
          }

          gl_FragColor = finalColor;
      }
    `;

    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
      
      // CRITICAL: Maximize pixel density. 
      // If projection is choppy due to massive GPU load, reduce this to 1 or 1.5
      pixelDensity(window.devicePixelRatio || 2); 
      
      quantumShader = createShader(vertShader, fragShader);
      noStroke();
    }

    function draw() {
      clear(0, 0, 0, 0); // Purge frame with pure transparency

      shader(quantumShader);
      quantumShader.setUniform('u_resolution', [width * pixelDensity(), height * pixelDensity()]);
      quantumShader.setUniform('u_time', millis() / 1000.0);
      
      // Pass normalized mouse coordinates for interactive parallax viewing
      let mx = mouseX / width;
      let my = mouseY / height;
      quantumShader.setUniform('u_mouse', [mx, my]);

      rectMode(CENTER);
      rect(0, 0, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra HD Immersive WebGL Raymarched Orb</title>
  <!-- Load p5.js library from official CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* The body background is set to transparent to prove the floating effect. */
      background-color: transparent; 
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="text/javascript">
    let immShader;

    // --- VERTEX SHADER ---
    // Minimal setup: Passes through screen position and normalized UVs (0.0 - 1.0).
    const vertShader = `
      attribute vec3 aPosition;
      varying vec2 vUv;
      void main() {
        vUv = aPosition.xy * 0.5 + 0.5;
        // Vertically flip for standard p5 WEBGL coordinates
        vUv.y = 1.0 - vUv.y; 
        gl_Position = vec4(aPosition, 1.0);
      }
    `;

    // --- FRAGMENT SHADER ---
    // The main engine: Performs raymarching, fractal complexity, and PBR lighting.
    const fragShader = `
      precision highp float;

      varying vec2 vUv;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse; // For interactive parallax

      // --- Helper Functions ---
      
      // 2D Rotation Matrix
      mat2 rot(float a) {
          float s = sin(a), c = cos(a);
          return mat2(c, -s, s, c);
      }

      // Cosine based color palette (by Inigo Quilez) for realistic iridescence
      vec3 palette( in float t ) {
          vec3 a = vec3(0.5, 0.5, 0.5);
          vec3 b = vec3(0.5, 0.5, 0.5);
          vec3 c = vec3(1.0, 1.0, 1.0);
          vec3 d = vec3(0.263, 0.416, 0.557);
          return a + b * cos( 6.28318 * (c * t + d) );
      }

      // --- SDF Map ---
      // This function defines the geometry by returning the nearest distance.
      // Shows: Domain warping, Fractal folding, Analytical SDFs.
      float map(vec3 p) {
          // Keep a reference for base sphere
          vec3 p0 = p;
          
          // --- Advanced Fractal Geometry (Research Showcase) ---
          // Rotate and fold space over iterations (similar to KIFS or Mandelbox)
          float scale = 1.2;
          p *= scale; // Initial scale-up
          
          for(int i = 0; i < 4; i++) {
              // Fractal rotation: Dynamic distortion over time
              p.xy *= rot(u_time * 0.15 + float(i) * 0.5);
              p.yz *= rot(u_time * 0.1 + float(i) * 0.2);
              
              // Mirror fold: Creates complex symmetry
              p = abs(p);
              
              // Apply domain warp distortion
              p.xz *= rot(sin(u_time * 0.5) * 0.3);
          }
          
          // Core SDF base: A highly distorted smooth sphere
          // Mixing length(p) creates organic texture, while max with sphere keeps it orb-like
          float d = mix(length(p), max(length(p0)-1.2, length(p)-2.5), 0.7);
          
          return d; // This value is the Signed Distance Field (SDF)
      }

      // --- Shading Calculations ---

      // Numerical Normal calculation
      vec3 getNormal(vec3 p) {
          vec2 e = vec2(0.001, 0.0);
          return normalize(vec3(
              map(p + e.xyy) - map(p - e.xyy),
              map(p + e.yxy) - map(p - e.yxy),
              map(p + e.yyx) - map(p - e.yyx)
          ));
      }

      // Soft Ambient Occlusion: Darkens deep crevices for depth realism
      float getAO(vec3 p, vec3 n) {
          float ao = 0.0;
          float sca = 1.0;
          for(int i=1; i<6; i++) {
              float d = float(i) * 0.03;
              float dist = map(p + n * d);
              ao += sca * (d - dist);
              sca *= 0.8;
          }
          return 1.0 - clamp(ao, 0.0, 1.0);
      }

      // --- Main Render Loop ---
      void main() {
          // Normalize pixel coordinates (-1.0 to 1.0) and fix aspect ratio
          vec2 uv = (vUv - 0.5) * 2.0;
          uv.x *= u_resolution.x / u_resolution.y;

          // --- Ray Setup ---
          // Normalize mouse input for camera interaction
          vec2 m = u_mouse * 2.0 - 1.0;
          m.x *= u_resolution.x / u_resolution.y;

          // Camera (Ray Origin) position with interaction parallax
          vec3 ro = vec3(sin(m.x * 0.5) * 3.5, 0.0, cos(m.x * 0.5) * 3.5 + 0.5); 
          ro.y += m.y * 1.5; // Up/down mouse parallax

          // Define target and ray direction
          vec3 target = vec3(0.0);
          vec3 z = normalize(target - ro);
          vec3 x = normalize(cross(vec3(0.0, 1.0, 0.0), z));
          vec3 y = cross(z, x);
          vec3 rd = normalize(uv.x * x + uv.y * y + 2.0 * z); // Ray Direction

          // --- Raymarching Engine ---
          float t = 0.0;     // Total distance marched
          float max_d = 10.0; // Maximum draw distance
          int steps = 0;
          
          for(int i = 0; i < 128; i++) {
              vec3 p = ro + rd * t;
              float d = map(p); // Sample distance at current point
              
              if(d < 0.001 || t > max_d) break; // Close hit or max depth
              t += d; // Jump forward by minimum safe distance
              steps = i;
          }

          // --- High Fidelity Shading & Lighting (PBR Approximation) ---
          
          // Default: Pure transparent black
          vec4 col_final = vec4(0.0, 0.0, 0.0, 0.0);

          if(t < max_d) {
              vec3 p = ro + rd * t;
              vec3 n = getNormal(p);
              vec3 v = normalize(ro - p); // View direction

              // --- Define realistic lighting elements ---
              vec3 lightPos = vec3(sin(u_time*0.5)*3.0, 2.0, 3.0);
              vec3 l = normalize(lightPos - p); // Light direction
              vec3 h = normalize(l + v); // Halfway vector (Blinn-Phong)

              // Blinn-Phong Shading parameters
              float diff = max(dot(n, l), 0.0);
              float spec = pow(max(dot(n, h), 0.0), 128.0); // Ultra tight glassy specular

              // Fresnel effect: Rim lighting that increases complexity on edges
              float fre = pow(1.0 - max(dot(n, v), 0.0), 3.0);

              // Subsurface approximation glow based on steps
              float occ = float(steps) / 128.0;

              // --- Base Color Calculation (using palette & time) ---
              vec3 albedo = palette(length(p)*0.3 + u_time * 0.3 + n.x * 0.2);
              
              // Ambient Occlusion enhancement
              float ao = getAO(p, n);

              // --- Integrate Lighting components ---
              // Combining organic complexity with realistic gloss
              vec3 col_rbg = albedo * (diff * 0.6 + 0.4); // Diffuse + Ambient
              col_rbg += albedo * (fre * 1.5); // Enhanced Iridescent Rim Light
              col_rbg += spec * 1.0; // Clear Specular Reflection
              
              // Apply advanced Ambient Occlusion to crevices
              col_rbg *= ao * 1.3;

              // Dynamic color shift specular (showcasing modern capabilities)
              col_rbg += spec * palette(u_time + fre) * 0.3; 
              
              // Inner volumetric glow based on ray complexity
              col_rbg += vec3(0.5, 0.8, 1.0) * occ * 0.2; 

              // --- Antialiasing & Edge Transparency ---
              // Special logic to ensure the edge of the orb is smooth (doesn't look bad projected)
              float edgeAlpha = smoothstep(0.0, 0.15, max(dot(n, v), 0.0));
              
              // Set Final Color with Solid Alpha where the orb exists
              col_final = vec4(col_rbg, edgeAlpha);

          } else {
              // Optional slight 'atmosphere' glow surrounding the orb if needed.
              // For pure floating effect, this is skipped to maintain transparency.
          }

          // Output the final color. Transparency is handled.
          gl_FragColor = col_final;
      }
    `;

    function setup() {
      // Must use WEBGL mode to enable custom shaders
      createCanvas(windowWidth, windowHeight, WEBGL);
      
      // CRITICAL FOR QUALITY: Doubles the pixel density for ultra-high-definition rendering.
      // Essential so the image does not break apart or look "aliased" when projected.
      pixelDensity(2); 
      
      immShader = createShader(vertShader, fragShader);
      noStroke();
    }

    function draw() {
      // Must use clear(0, 0, 0, 0) to maintain transparency in p5's WEBGL mode.
      clear(0, 0, 0, 0); 

      // Activate the raymarching shader
      shader(immShader);
      
      // Pass required uniforms to the fragment shader
      immShader.setUniform('u_resolution', [width * pixelDensity(), height * pixelDensity()]);
      immShader.setUniform('u_time', millis() / 1000.0);
      immShader.setUniform('u_mouse', [mouseX / width, mouseY / height]); // Normalised mouse input

      // Draw a screen-spanning rectangle.
      // p5 renders this single rectangle, but the fragment shader completely controls the output.
      rectMode(CENTER);
      rect(0, 0, width, height);
    }

    // Ensure the canvas adapts to screen changes smoothly
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>

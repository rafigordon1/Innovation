<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Organic Spore Rings</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE RINGS ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // Audio Envelopes (Fast attack for punchy reactivity, slow release for organic fluidity)
    let envBass = 0, envMids = 0, envTreble = 0;
    const ATTACK = 0.35;  
    const RELEASE = 0.04; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.6; // Low smoothing for raw, aggressive reactivity
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.006); 
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 0, 60); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    // --- ORGANIC SPORE RINGS (Strict geometric correlations) ---
    const ringCount = 8;
    const particlesPerRing = 6000; // Dense, fluid swarms
    
    const ringSystems = [];

    // The strict angles requested
    const strictAngles = [
        0,              // 0 deg
        Math.PI / 4,    // 45 deg
        Math.PI / 2,    // 90 deg
        Math.PI * 0.75  // 135 deg
    ];

    // Generate a soft glowing dot for the particles
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const particleTexture = new THREE.CanvasTexture(canvas);

    for (let r = 0; r < ringCount; r++) {
        let geo = new THREE.BufferGeometry();
        let pos = new Float32Array(particlesPerRing * 3);
        let basePos = new Float32Array(particlesPerRing * 3); 
        let angles = new Float32Array(particlesPerRing); // Store the original angle for smooth cymatic ripples
        
        let baseRadius = 25 + (r * 2); 

        for (let i = 0; i < particlesPerRing; i++) {
            let theta = (i / particlesPerRing) * Math.PI * 2;
            
            // Organic fuzziness to make the ring thick like a swarm
            let fuzzX = (Math.random() - 0.5) * 2.5;
            let fuzzY = (Math.random() - 0.5) * 2.5;
            let fuzzZ = (Math.random() - 0.5) * 2.5;

            let x = Math.cos(theta) * baseRadius + fuzzX;
            let y = Math.sin(theta) * baseRadius + fuzzY;
            let z = fuzzZ;

            pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
            basePos[i*3] = x; basePos[i*3+1] = y; basePos[i*3+2] = z;
            angles[i] = theta;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.userData = { basePos: basePos, angles: angles, baseRadius: baseRadius };

        let mat = new THREE.PointsMaterial({
            size: 1.0,
            map: particleTexture,
            // Alternate strict palette: Pink, Blue, White
            color: (r % 3 === 0) ? 0xFFB6C1 : (r % 3 === 1) ? 0xADD8E6 : 0xFFFFFF,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        let system = new THREE.Points(geo, mat);
        
        // Lock them into the strict requested angles
        let angleX = strictAngles[r % 4];
        let angleY = strictAngles[Math.floor(r / 2) % 4];
        system.rotation.set(angleX, angleY, 0);
        
        scene.add(system);
        ringSystems.push(system);
    }

    // --- BACKGROUND DUST (Ambient Depth) ---
    const dustCount = 3000;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
        dustPos[i*3] = (Math.random() - 0.5) * 300;
        dustPos[i*3+1] = (Math.random() - 0.5) * 300;
        dustPos[i*3+2] = (Math.random() - 0.5) * 300;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.3,
        transparent: true,
        opacity: 0.3,
        depthWrite: false
    });
    const dustSystem = new THREE.Points(dustGeo, dustMat);
    scene.add(dustSystem);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // 1. Audio Processing
        analyser.getByteFrequencyData(dataArray);

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 15; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 20; i < 120; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 15;
        let rawMids = midSum / 100;
        let rawTreble = trebleSum / 105;

        // Apply organic smoothing envelopes & boost multipliers for massive reactivity
        envBass = smoothAudio(envBass, rawBass * 2.2);
        envMids = smoothAudio(envMids, rawMids * 2.5);
        envTreble = smoothAudio(envTreble, rawTreble * 3.0);

        // 3. Update the Spore Rings
        for (let r = 0; r < ringCount; r++) {
            let sys = ringSystems[r];
            let posAttr = sys.geometry.attributes.position;
            let basePos = sys.geometry.userData.basePos;
            let angles = sys.geometry.userData.angles;
            let baseRadius = sys.geometry.userData.baseRadius;
            
            // The rings spin on their local Z axis naturally over time
            sys.rotation.z = time * 0.15 * (r % 2 === 0 ? 1 : -1);

            // Particles react physically to music
            for(let i = 0; i < particlesPerRing; i++) {
                let bx = basePos[i*3];
                let by = basePos[i*3+1];
                let bz = basePos[i*3+2];
                let theta = angles[i];
                
                // Mids create liquid cymatic ripples along the ring
                // Modulate the wave frequency based on which ring it is
                let rippleWave = Math.sin(theta * (4.0 + r) - time * 3.0);
                let rippleMagnitude = envMids * 10.0;
                let rippleOffset = rippleWave * rippleMagnitude;

                // Bass expands the radius globally (outward push)
                // Add the ripple offset proportional to the radius
                let expansion = 1.0 + (envBass * 0.5) + (rippleOffset / baseRadius);
                
                // Treble causes local frantic jittering (like excited electrons)
                let jitter = envTreble * 2.5;
                let jx = (Math.random() - 0.5) * jitter;
                let jy = (Math.random() - 0.5) * jitter;
                let jz = (Math.random() - 0.5) * jitter;

                posAttr.array[i*3] = (bx * expansion) + jx;
                posAttr.array[i*3+1] = (by * expansion) + jy;
                // Add the ripple into the Z axis as well for true 3D fluid motion
                posAttr.array[i*3+2] = (bz * expansion) + jz + (Math.cos(theta * 6.0) * rippleMagnitude);
            }
            posAttr.needsUpdate = true;
            
            // Rings glow significantly brighter with the high hats/synths
            sys.material.opacity = 0.5 + (envTreble * 0.5);
            sys.material.size = 1.0 + (envTreble * 2.0);
        }

        // 4. Cinematic Reactive Camera
        // Drift slowly around the rings
        camera.position.x = Math.sin(time * 0.1) * 20;
        camera.position.y = Math.cos(time * 0.15) * 10;
        
        // Bass hits cause a heavy physical camera bump backwards, expanding the view
        camera.position.z = 60 + (envBass * 15.0);
        camera.lookAt(0, 0, 0);

        // Ambient dust rotation
        dustSystem.rotation.y = time * 0.05;
        dustSystem.rotation.x = time * 0.02;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

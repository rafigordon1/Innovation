<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Plasma Containment Core</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010102;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE CONTAINMENT CORE ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // GPU Audio Texture Data
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes (Ensures buttery smooth, jitter-free reactions)
    let envBass = 0, envMids = 0, envTreble = 0;
    
    // Attack/Release parameters for liquid momentum
    const ATTACK = 0.2; 
    const RELEASE = 0.03; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.65; // Highly responsive base signal
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010102, 0.008); 
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 0, 70); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010102, 1);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO TEXTURE FOR SHADER ---
    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- 1. THE PLASMA COIL (Torus Knot) ---
    // High poly count to allow for smooth ferrofluid-like audio spikes
    const coreGeo = new THREE.TorusKnotGeometry(16, 4.5, 400, 80);

    const coreUniforms = {
        uTime: { value: 0 },
        uAudioTex: { value: audioTexture },
        uBass: { value: 0 },
        uMids: { value: 0 },
        uTreble: { value: 0 }
    };

    const coreMaterial = new THREE.ShaderMaterial({
        uniforms: coreUniforms,
        transparent: true,
        depthWrite: true,
        vertexShader: `
            uniform float uTime;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uMids;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                vUv = uv;

                // Map audio along the length of the knot (uv.x)
                // We wrap it smoothly to prevent a seam
                float freq = abs(fract(uv.x * 6.0) - 0.5) * 2.0; 
                float audioVal = texture2D(uAudioTex, vec2(freq, 0.5)).r;
                vAudioVal = audioVal;

                vec3 pos = position;

                // Ferrofluid audio spikes!
                // Only frequencies hitting hard enough push the geometry out
                float spike = smoothstep(0.5, 1.0, audioVal);
                
                // Add a dynamic ripple so the spikes aren't totally uniform
                float ripple = sin(uv.y * 30.0 + uTime * 10.0) * 0.5 + 0.5;
                
                // Extrude vertices along their normal based on the music
                pos += normal * (spike * uMids * 12.0 * ripple);

                // Overall breathing/scaling from the bass
                pos *= 1.0 + (uBass * 0.15);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vPos = mvPosition.xyz; // Pass to fragment for depth fading
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uTreble;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                // Procedural Digital Wireframe
                vec2 grid = abs(fract(vUv * vec2(200.0, 40.0) + vec2(uTime * 0.1, uTime * 0.2)) - 0.5);
                float line = smoothstep(0.35, 0.45, max(grid.x, grid.y));

                // Strict Palette: Soft Pink & Soft Blue
                vec3 pink = vec3(1.0, 0.71, 0.75);
                vec3 blue = vec3(0.67, 0.84, 0.90);
                vec3 white = vec3(1.0, 1.0, 1.0);
                
                // Color flows along the knot over time
                float colorMix = sin(vUv.x * 12.0 + uTime) * 0.5 + 0.5;
                vec3 baseNeon = mix(pink, blue, colorMix);

                // Heavy audio spikes flash bright white
                vec3 glowColor = mix(baseNeon, white, vAudioVal * 0.6);

                // Calculate final intensity
                float intensity = 0.3 + (vAudioVal * 4.0) + (uTreble * 3.0);
                vec3 neonGlow = glowColor * line * intensity;

                // The base of the knot is pitch black metal
                vec3 surfaceColor = vec3(0.01) * (1.0 - line);

                // Apply cinematic depth fade (fog)
                float depthFade = exp(-abs(vPos.z) * 0.008);
                
                gl_FragColor = vec4((surfaceColor + neonGlow) * depthFade, 1.0);
            }
        `
    });

    const containmentCore = new THREE.Mesh(coreGeo, coreMaterial);
    scene.add(containmentCore);


    // --- 2. CONTAINMENT RINGS (Strict 45/90/135 degree correlation) ---
    const ringCount = 8;
    const ringGeo = new THREE.TorusGeometry(35, 0.1, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    
    const ringMesh = new THREE.InstancedMesh(ringGeo, ringMat, ringCount);
    scene.add(ringMesh);

    const dummy = new THREE.Object3D();
    
    // Strict Angles array
    const strictAngles = [
        0,              // 0 deg
        Math.PI / 4,    // 45 deg
        Math.PI / 2,    // 90 deg
        Math.PI * 0.75  // 135 deg
    ];

    const colors = [
        new THREE.Color(0xFFB6C1), // Soft Pink
        new THREE.Color(0xADD8E6)  // Soft Blue
    ];

    // Setup initial rotations for the containment rings
    for (let i = 0; i < ringCount; i++) {
        // Distribute angles evenly across the X and Y axes
        let angleX = strictAngles[i % 4];
        let angleY = strictAngles[Math.floor(i / 2) % 4];
        
        dummy.position.set(0, 0, 0);
        dummy.rotation.set(angleX, angleY, 0);
        dummy.updateMatrix();
        
        ringMesh.setMatrixAt(i, dummy.matrix);
        
        // Alternate colors
        ringMesh.setColorAt(i, colors[i % 2]);
    }
    ringMesh.instanceMatrix.needsUpdate = true;


    // --- 3. BACKGROUND DUST (Ambient Depth) ---
    const dustCount = 3000;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
        dustPos[i*3] = (Math.random() - 0.5) * 200;
        dustPos[i*3+1] = (Math.random() - 0.5) * 200;
        dustPos[i*3+2] = (Math.random() - 0.5) * 200;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.3,
        transparent: true,
        opacity: 0.3,
        depthWrite: false
    });
    const dustSystem = new THREE.Points(dustGeo, dustMat);
    scene.add(dustSystem);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        for(let i=0; i<dataArray.length; i++) {
            // Amplified so the spikes trigger noticeably even on mid-volume songs
            audioData[i] = Math.min(255, dataArray[i] * 2.2);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 15; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 20; i < 100; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 15;
        let rawMids = midSum / 80;
        let rawTreble = trebleSum / 105;

        // Smooth envelopes
        envBass = smoothAudio(envBass, rawBass * 1.8);
        envMids = smoothAudio(envMids, rawMids * 1.8);
        envTreble = smoothAudio(envTreble, rawTreble * 2.0);

        // 3. Update the Plasma Core
        coreUniforms.uTime.value = time;
        coreUniforms.uBass.value = envBass;
        coreUniforms.uMids.value = envMids;
        coreUniforms.uTreble.value = envTreble;

        // Rotate the core slowly
        containmentCore.rotation.y = time * 0.15;
        containmentCore.rotation.x = time * 0.05;

        // 4. Update the Containment Rings
        // Bass causes the rings to dilate/expand outward violently
        let ringScale = 1.0 + (envBass * 0.6);
        
        for (let i = 0; i < ringCount; i++) {
            let angleX = strictAngles[i % 4];
            let angleY = strictAngles[Math.floor(i / 2) % 4];
            
            // The entire containment field rotates on Z over time
            let spinZ = time * 0.2 * (i % 2 === 0 ? 1 : -1); 

            dummy.position.set(0, 0, 0);
            dummy.rotation.set(angleX, angleY, spinZ);
            dummy.scale.set(ringScale, ringScale, ringScale);
            dummy.updateMatrix();
            
            ringMesh.setMatrixAt(i, dummy.matrix);
        }
        ringMesh.instanceMatrix.needsUpdate = true;
        
        // Treble makes the rings glow aggressively
        ringMat.opacity = 0.3 + (envTreble * 0.7);

        // 5. Cinematic Camera Orbit
        // Drift around the core, reacting slightly to bass
        camera.position.x = Math.sin(time * 0.1) * (20 + envBass * 5);
        camera.position.y = Math.cos(time * 0.15) * 10;
        camera.lookAt(0, 0, 0);

        // Dust rotation
        dustSystem.rotation.y = time * 0.05;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

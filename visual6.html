<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - The Dyson Matrix</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE DYSON MATRIX ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // GPU Audio Texture Data
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes (Buttery smooth macro-reactions)
    let envBass = 0, envMids = 0, envTreble = 0;
    const ATTACK = 0.35;  
    const RELEASE = 0.04; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.6; // Low smoothing for sharp visual strikes
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.005); 
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 15, 90); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO TEXTURE FOR SHADER ---
    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- GENERATE GLOWING PARTICLE TEXTURE ---
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const particleTexture = new THREE.CanvasTexture(canvas);

    // --- BUILD THE DYSON SPHERE GEOMETRY ---
    const R = 40; // Sphere Radius
    const positions = [];
    const colors = [];
    const types = []; // 0 = Latitude Ring, 1 = Longitude Line
    const origPos = [];

    // 1. Latitude Rings (Pink and Blue)
    const numLatitudes = 120;
    for(let j = 1; j < numLatitudes; j++) {
        let phi = (j / numLatitudes) * Math.PI; // 0 to PI
        let y = Math.cos(phi) * R;
        let ringR = Math.sin(phi) * R;

        let pointsInRing = Math.floor(ringR * 8) + 10;
        let isPink = (j % 2 === 0);
        let color = isPink ? [1.0, 0.71, 0.75] : [0.67, 0.84, 0.90]; // Strict Soft Pink / Blue

        for(let i = 0; i < pointsInRing; i++) {
            let theta = (i / pointsInRing) * Math.PI * 2;
            let x = Math.cos(theta) * ringR;
            let z = Math.sin(theta) * ringR;

            positions.push(x, y, z);
            origPos.push(x, y, z);
            colors.push(...color);
            types.push(0.0);
        }
    }

    // 2. Longitude Lines (Strict Geometric Angles: 0, 45, 90, 135)
    // These inherently cover 180, 225, 270, 315 on the back side of the sphere.
    const strictAngles = [0, 45, 90, 135].map(a => a * Math.PI / 180);
    for(let a of strictAngles) {
        let numPoints = 800; // Very dense so the white lines look solid and prominent
        for(let i = 0; i < numPoints; i++) {
            let phi = (i / numPoints) * Math.PI * 2; // Full circle
            let y = Math.cos(phi) * R;
            let ringR = Math.sin(phi) * R;

            let x = Math.cos(a) * ringR;
            let z = Math.sin(a) * ringR;

            positions.push(x, y, z);
            origPos.push(x, y, z);
            colors.push(1.0, 1.0, 1.0); // Pure White
            types.push(1.0);
        }
    }

    const sphereGeo = new THREE.BufferGeometry();
    sphereGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    sphereGeo.setAttribute('aOrigPos', new THREE.Float32BufferAttribute(origPos, 3));
    sphereGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    sphereGeo.setAttribute('aType', new THREE.Float32BufferAttribute(types, 1));

    // --- CUSTOM GPU SHADER MATERIAL ---
    const customUniforms = {
        uTime: { value: 0 },
        uAudioTex: { value: audioTexture },
        uPointTex: { value: particleTexture },
        uBass: { value: 0 },
        uMids: { value: 0 },
        uTreble: { value: 0 }
    };

    const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: customUniforms,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            uniform float uTime;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uMids;
            uniform float uTreble;

            attribute vec3 aOrigPos;
            attribute float aType;

            varying vec3 vColor;
            varying float vType;
            varying float vSpark;
            varying float vAudioVal;

            void main() {
                vColor = color;
                vType = aType;
                vec3 pos = position;
                
                // Normal direction (outward from center of sphere)
                vec3 normalDir = normalize(aOrigPos);

                // 1. MACRO AUDIO DISPLACEMENT (Bass & Mids)
                // Bass inflates the entire sphere
                float expansion = uBass * 8.0;
                
                // Mids create cymatic ripples across the surface
                float ripple = sin(aOrigPos.y * 0.3 - uTime * 4.0) * (uMids * 4.0) +
                               cos(aOrigPos.x * 0.3 + uTime * 3.0) * (uMids * 4.0);

                pos += normalDir * (expansion + ripple);

                // 2. MICRO AUDIO DISPLACEMENT (Raw FFT Texture)
                vAudioVal = 0.0;
                vSpark = 0.0;

                if (aType < 0.5) {
                    // LATITUDE RINGS (Pink/Blue)
                    // Map the Y position (equator to pole) to the frequency spectrum (0 to 1)
                    float normalizedY = abs(aOrigPos.y / 40.0); 
                    // Curve it so bass handles the equator, treble handles the poles
                    float audioVal = texture2D(uAudioTex, vec2(pow(normalizedY, 0.8), 0.5)).r;
                    vAudioVal = audioVal;

                    // Extrude the ring particles based on exact frequency
                    pos += normalDir * (audioVal * uTreble * 8.0);
                } 
                else {
                    // LONGITUDE LINES (White Strict Angles)
                    // Treble sends high-speed data sparks down the white lines
                    float sparkWave = sin(aOrigPos.y * 0.4 - uTime * 15.0);
                    float isSpark = step(0.98, sparkWave); // Only trigger at the peak of the sine wave
                    
                    vSpark = isSpark * uTreble * 2.0;
                    
                    // The spark physically bulges the line outward
                    pos += normalDir * (isSpark * uTreble * 10.0);
                }

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                
                // Base point size + reactive scaling
                float pSize = 1.0 + (vAudioVal * 4.0) + (vSpark * 3.0) + (uBass * 1.5);
                gl_PointSize = pSize * (150.0 / -mvPosition.z);
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform sampler2D uPointTex;
            uniform float uTreble;
            uniform float uBass;

            varying vec3 vColor;
            varying float vType;
            varying float vSpark;
            varying float vAudioVal;

            void main() {
                vec4 texColor = texture2D(uPointTex, gl_PointCoord);
                
                vec3 finalColor = vColor;
                float finalAlpha = texColor.a;

                if (vType < 0.5) {
                    // LATITUDE RINGS
                    // Glow intensifies where the local audio frequency hits
                    finalColor += vec3(vAudioVal * 0.8);
                    finalAlpha *= (0.4 + vAudioVal * 0.8 + uBass * 0.3);
                } else {
                    // LONGITUDE LINES (White)
                    // Lines are always visible, but glow bright with treble
                    finalColor += vec3(uTreble * 1.5) + vec3(vSpark);
                    finalAlpha *= (0.6 + uTreble * 0.5 + vSpark);
                }
                
                gl_FragColor = vec4(finalColor, finalAlpha);
            }
        `
    });

    const dysonSphere = new THREE.Points(sphereGeo, shaderMaterial);
    scene.add(dysonSphere);

    // --- AMBIENT DUST ---
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000; i++) {
        dustPos[i*3] = (Math.random() - 0.5) * 200;
        dustPos[i*3+1] = (Math.random() - 0.5) * 200;
        dustPos[i*3+2] = (Math.random() - 0.5) * 200;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0xffffff, size: 0.3, transparent: true, opacity: 0.3, depthWrite: false
    });
    const dustSystem = new THREE.Points(dustGeo, dustMat);
    scene.add(dustSystem);


    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        // Massive signal booster to ensure deep reactivity to all layers of music
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 2.8);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 15; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 20; i < 120; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 15;
        let rawMids = midSum / 100;
        let rawTreble = trebleSum / 105;

        // Apply organic smoothing envelopes
        envBass = smoothAudio(envBass, rawBass * 2.0);
        envMids = smoothAudio(envMids, rawMids * 2.5);
        envTreble = smoothAudio(envTreble, rawTreble * 3.0);

        // 3. Update the Dyson Sphere
        customUniforms.uTime.value = time;
        customUniforms.uBass.value = envBass;
        customUniforms.uMids.value = envMids;
        customUniforms.uTreble.value = envTreble;

        // Rotate the entire sphere smoothly
        dysonSphere.rotation.y = time * 0.15;
        dysonSphere.rotation.z = time * 0.05;

        // 4. Cinematic Reactive Camera
        // Orbit around the sphere
        camera.position.x = Math.sin(time * 0.2) * 35;
        camera.position.y = 15 + Math.cos(time * 0.3) * 10;
        
        // Bass drops cause the camera to pull back, revealing the expanded sphere
        camera.position.z = 85 + (envBass * 20.0);
        camera.lookAt(0, 0, 0);

        dustSystem.rotation.y = time * 0.05;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

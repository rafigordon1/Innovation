<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - The Neural Lattice</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO IGNITE LATTICE ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // GPU Audio Texture
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes & Flight Distance
    let envBass = 0, envMids = 0, envTreble = 0;
    let flightDistance = 0; 
    let currentFlightSpeed = 0.05; 
    
    // Snappy attack, smooth release
    const ATTACK = 0.25; 
    const RELEASE = 0.03; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.6; // High responsiveness
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.008); 
    
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 0, 0); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- BUILD THE INFINITE NEURAL LATTICE ---
    const instanceCount = 12000;
    
    // We use a basic 1x1x1 box. The vertex shader will stretch it into long beams based on audio
    const beamGeo = new THREE.BoxGeometry(1, 1, 1);
    
    // Instanced Attributes
    const colors = new Float32Array(instanceCount * 3);
    const freqBins = new Float32Array(instanceCount); // Which audio bin this beam listens to
    const isDiagonal = new Float32Array(instanceCount); // Identifies the white diagonal lines for data-pulses

    const dummy = new THREE.Object3D();
    const meshMatrix = new THREE.InstancedMesh(beamGeo, null, instanceCount); // Material set later

    let i = 0;
    // Generate a massive 3D grid
    for (let x = -50; x <= 50; x += 8) {
        for (let y = -50; y <= 50; y += 8) {
            for (let z = 50; z >= -350; z -= 8) {
                if (i >= instanceCount) break;

                // Carve out a hollow central cavern for the camera to fly through safely
                let distFromCenter = Math.sqrt(x*x + y*y);
                if (distFromCenter < 12) continue; // Skip generating beams in the center

                // Add organic noise so it's not a perfect grid, creating "pockets"
                if (Math.random() > 0.6) continue;

                // STRICT GEOMETRIC ASSIGNMENT
                let randAngle = Math.random();
                let col, rot, diagFlag = 0.0;

                if (randAngle < 0.25) {
                    // 0 Degrees (Horizontal X) -> Soft Pink
                    rot = [0, 0, 0];
                    col = [1.0, 0.71, 0.75];
                } else if (randAngle < 0.5) {
                    // 90 Degrees (Vertical Y) -> Soft Blue
                    rot = [0, 0, Math.PI / 2];
                    col = [0.67, 0.84, 0.90];
                } else if (randAngle < 0.75) {
                    // 45 Degrees (Diagonal XZ) -> White
                    rot = [0, Math.PI / 4, 0];
                    col = [1.0, 1.0, 1.0];
                    diagFlag = 1.0;
                } else {
                    // 135 Degrees (Diagonal XZ) -> White
                    rot = [0, 3 * Math.PI / 4, 0];
                    col = [1.0, 1.0, 1.0];
                    diagFlag = 1.0;
                }

                // Random spatial jitter to make the architecture complex
                let jx = x + (Math.random() - 0.5) * 4;
                let jy = y + (Math.random() - 0.5) * 4;
                let jz = z + (Math.random() - 0.5) * 4;

                dummy.position.set(jx, jy, jz);
                dummy.rotation.set(rot[0], rot[1], rot[2]);
                dummy.updateMatrix();
                
                meshMatrix.setMatrixAt(i, dummy.matrix);
                
                colors[i*3] = col[0];
                colors[i*3+1] = col[1];
                colors[i*3+2] = col[2];
                
                // Map frequency bin based on distance from center (inner beams get bass, outer get treble)
                freqBins[i] = Math.min(1.0, distFromCenter / 70.0);
                isDiagonal[i] = diagFlag;
                
                i++;
            }
        }
    }
    
    // Update count in case we skipped some via noise
    meshMatrix.count = i;
    
    beamGeo.setAttribute('aColor', new THREE.InstancedBufferAttribute(colors, 3));
    beamGeo.setAttribute('aFreqBin', new THREE.InstancedBufferAttribute(freqBins, 1));
    beamGeo.setAttribute('aIsDiagonal', new THREE.InstancedBufferAttribute(isDiagonal, 1));

    // --- CUSTOM KINETIC SHADER MATERIAL ---
    const latticeUniforms = {
        uTime: { value: 0 },
        uScroll: { value: 0 },
        uAudioTex: { value: audioTexture },
        uBass: { value: 0 },
        uMids: { value: 0 },
        uTreble: { value: 0 }
    };

    const latticeMaterial = new THREE.ShaderMaterial({
        uniforms: latticeUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: true,
        vertexShader: `
            uniform float uTime;
            uniform float uScroll;
            uniform sampler2D uAudioTex;
            
            uniform float uBass;
            uniform float uMids;
            uniform float uTreble;

            attribute vec3 aColor;
            attribute float aFreqBin;
            attribute float aIsDiagonal;

            varying vec3 vColor;
            varying vec2 vUv;
            varying float vAudio;
            varying float vIsDiagonal;
            varying float vLocalZ;
            varying vec3 vWorldPos;

            void main() {
                vUv = uv;
                vColor = aColor;
                vIsDiagonal = aIsDiagonal;

                // Read exact audio volume for this specific beam
                float rawAudio = texture2D(uAudioTex, vec2(aFreqBin, 0.5)).r;
                vAudio = rawAudio;

                // 1. KINETIC EXTRUSION (The Core Innovation)
                // The base cube is 1x1x1. We scale it along its LOCAL Z-axis to turn it into a beam.
                // Mids drive the length. High mids = the beams physically shoot out and intersect.
                vec3 localPos = position;
                
                float targetLength = 3.0 + (rawAudio * 45.0 * (1.0 + uMids * 2.5));
                localPos.z *= targetLength;
                vLocalZ = localPos.z; // Pass to fragment for data-stream pulses

                // Bass thickens the beams violently
                float thickness = 0.15 + (uBass * 1.5 * aFreqBin) + (rawAudio * 0.4);
                localPos.x *= thickness;
                localPos.y *= thickness;

                // 2. INFINITE TUNNEL WRAP
                // Transform local beam to world space
                vec4 worldPos = instanceMatrix * vec4(localPos, 1.0);
                
                // Add the accumulated flight distance to move the tunnel past the camera
                worldPos.z += uScroll;
                
                // Math to loop the tunnel infinitely without the user ever noticing
                // Tunnel exists between +50 and -350 (Length: 400).
                float tunnelLen = 400.0;
                worldPos.z = mod(worldPos.z - 50.0, tunnelLen) - tunnelLen + 50.0;
                
                vWorldPos = worldPos.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uTreble;
            uniform float uBass;

            varying vec3 vColor;
            varying vec2 vUv;
            varying float vAudio;
            varying float vIsDiagonal;
            varying float vLocalZ;
            varying vec3 vWorldPos;

            void main() {
                // Procedural Glowing Wireframe Edge
                vec2 grid = abs(vUv - 0.5) * 2.0; // 0 at center, 1 at edges
                float edge = smoothstep(0.7, 1.0, max(grid.x, grid.y));

                // The base of the architecture is pitch black, glossy obsidian
                vec3 baseMetal = vec3(0.01);
                
                // Edge Glow (Neon light bleeding out of the metallic casing)
                float glowIntensity = (vAudio * 3.0) + (uTreble * 2.0);
                vec3 edgeGlow = vColor * edge * glowIntensity;
                
                // Additive final color
                vec3 finalColor = baseMetal + edgeGlow;

                // THE DATA PULSE (Treble injects white light down the diagonal axes)
                if (vIsDiagonal > 0.5) {
                    // A sine wave traveling down the local length of the beam
                    float pulse = sin(vLocalZ * 1.5 - uTime * 20.0);
                    // Snap it so it looks like a distinct laser packet, not a blurry wave
                    float isSpark = step(0.95, pulse); 
                    
                    // Add blinding white spark multiplied by treble
                    finalColor += vec3(isSpark) * (vAudio + uTreble * 5.0) * vColor;
                }

                // Deep depth fading (Exponential fog) to hide the wrapping point seamlessly
                float depthFade = exp(-abs(vWorldPos.z) * 0.008);

                gl_FragColor = vec4(finalColor * depthFade, 1.0);
            }
        `
    });

    meshMatrix.material = latticeMaterial;
    scene.add(meshMatrix);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        let delta = Math.min(clock.getDelta(), 0.1); 
        const time = clock.getElapsedTime();

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        // Push raw audio to GPU. Multiplier boosted for intense structural reactivity
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 2.5);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 15; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 20; i < 120; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 15;
        let rawMids = midSum / 100;
        let rawTreble = trebleSum / 105;

        // Smooth envelopes
        envBass = smoothAudio(envBass, rawBass * 1.8);
        envMids = smoothAudio(envMids, rawMids * 2.0);
        envTreble = smoothAudio(envTreble, rawTreble * 2.5);

        // 3. SMOOTH INERTIA FLIGHT MECHANIC
        // Bass drops instantly accelerate you to warp speed through the matrix
        let targetFlightSpeed = 0.05 + (envBass * 8.0);
        currentFlightSpeed += (targetFlightSpeed - currentFlightSpeed) * 0.1;
        flightDistance += currentFlightSpeed * delta * 50.0; // Scaled for massive scale

        // 4. Update Shader Uniforms
        latticeUniforms.uTime.value = time;
        latticeUniforms.uScroll.value = flightDistance; 
        latticeUniforms.uBass.value = envBass;
        latticeUniforms.uMids.value = envMids;
        latticeUniforms.uTreble.value = envTreble;

        // 5. Camera Drift
        // Subtly sway the camera to give a sense of floating weightlessly in the matrix
        camera.rotation.z = Math.sin(flightDistance * 0.02) * 0.1;
        camera.position.x = Math.cos(flightDistance * 0.03) * 2.0;
        camera.position.y = Math.sin(flightDistance * 0.025) * 2.0;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Cybernetic Wormhole</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO ENTER WORMHOLE ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // Texture for GPU Shader
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes (Ensures buttery smooth, jitter-free reactions)
    let envBass = 0, envMids = 0, envTreble = 0;
    const ATTACK = 0.25; 
    const RELEASE = 0.04; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.65; // Highly sensitive base reading
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.006); // Deep fog hides the end of the tunnel
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 0, 0); // Looking down the -Z axis

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    // Use additive blending globally for a highly glowing, neon look
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO TEXTURE ---
    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- 1. THE CYBER-TUBE (Wormhole Walls) ---
    const tubeGeo = new THREE.CylinderGeometry(30, 30, 400, 64, 128);
    tubeGeo.rotateX(Math.PI / 2); // Lay flat along Z axis
    tubeGeo.translate(0, 0, -200); // Push into the screen

    const tubeUniforms = {
        uTime: { value: 0 },
        uAudioTex: { value: audioTexture },
        uBass: { value: 0 },
        uMids: { value: 0 }
    };

    const tubeMaterial = new THREE.ShaderMaterial({
        uniforms: tubeUniforms,
        side: THREE.BackSide, // We are inside the tube
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            uniform float uTime;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uMids;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                vUv = uv;
                vec3 pos = position;

                // 1. Map Audio around the circumference of the tube
                float angle = atan(pos.y, pos.x);
                float freq = abs(angle / 3.14159); // 0 to 1
                float audioVal = texture2D(uAudioTex, vec2(freq, 0.5)).r;
                vAudioVal = audioVal;

                // 2. Audio Expansion (Bass pushes the tunnel walls outward)
                float expansion = 1.0 + (audioVal * uBass * 0.4);
                pos.x *= expansion;
                pos.y *= expansion;

                // 3. The Snake Bend
                // The tunnel writhes like a snake, intensifying further away from the camera
                float distFromCam = abs(pos.z);
                float dampening = smoothstep(0.0, 150.0, distFromCam); // Keeps the entrance stable
                
                float bendX = sin(pos.z * 0.01 + uTime * 0.8) * 40.0;
                float bendY = cos(pos.z * 0.015 + uTime * 0.6) * 40.0;
                
                // Mids amplify the writhing
                pos.x += bendX * dampening * (1.0 + uMids * 1.5);
                pos.y += bendY * dampening * (1.0 + uMids * 1.5);

                vPos = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uBass;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                // Scroll the texture forward based on Time + Bass (Creates flight illusion)
                vec2 scrolledUv = vUv;
                scrolledUv.y -= uTime * (0.5 + uBass * 1.5); 
                
                // Procedural Digital Grid
                vec2 grid = abs(fract(scrolledUv * vec2(40.0, 100.0)) - 0.5);
                float line = smoothstep(0.42, 0.5, max(grid.x, grid.y));
                
                // Deep Fade into black
                float depthFade = exp(-abs(vPos.z) * 0.01);

                // Strict Palette: Soft Pink & Soft Blue
                vec3 pink = vec3(1.0, 0.71, 0.75);
                vec3 blue = vec3(0.67, 0.84, 0.90);
                
                // Alternate colors around the tube
                vec3 baseColor = mix(pink, blue, sin(vUv.x * 30.0) * 0.5 + 0.5);
                
                // Glow massively when hit by audio
                vec3 finalColor = baseColor * line * (0.5 + vAudioVal * 4.0);
                
                gl_FragColor = vec4(finalColor * depthFade, 1.0);
            }
        `
    });

    const tube = new THREE.Mesh(tubeGeo, tubeMaterial);
    scene.add(tube);


    // --- 2. FLOATING ARTIFACTS (Circles & Fine Geometric Lines) ---
    
    // Strict Palette
    const colors = [
        new THREE.Color(0xFFB6C1), // Soft Pink
        new THREE.Color(0xADD8E6), // Soft Blue
        new THREE.Color(0xFFFFFF)  // White
    ];

    // Shared Additive Material for Artifacts
    const artifactMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    // A. The Rings (Torus)
    const ringCount = 150;
    const ringGeo = new THREE.TorusGeometry(3, 0.05, 8, 32); // Very thin, hollow rings
    const ringMesh = new THREE.InstancedMesh(ringGeo, artifactMat, ringCount);
    
    // B. The Fine Arrows (Long Cylinders)
    const lineCount = 300;
    const lineGeo = new THREE.CylinderGeometry(0.04, 0.04, 15, 8); // Fine, long lines
    lineGeo.rotateX(Math.PI / 2); // Point them down the tunnel
    const lineMesh = new THREE.InstancedMesh(lineGeo, artifactMat, lineCount);

    scene.add(ringMesh);
    scene.add(lineMesh);

    // Arrays to store artifact data (Z-position, offset, scale multipliers)
    const artifactData = [];
    const dummy = new THREE.Object3D();

    // Initialize Rings
    for (let i = 0; i < ringCount; i++) {
        let z = -Math.random() * 400;
        let angle = Math.random() * Math.PI * 2;
        let radius = Math.random() * 20; // Scattered inside the tube
        
        let c = colors[Math.floor(Math.random() * colors.length)];
        ringMesh.setColorAt(i, c);

        artifactData.push({
            type: 'ring',
            idx: i,
            xOffset: Math.cos(angle) * radius,
            yOffset: Math.sin(angle) * radius,
            z: z,
            scaleMod: 1.0 + Math.random() * 1.5
        });
    }

    // Initialize Fine Lines (Strict 45, 90, 135, 180 degree angles)
    const strictAngles = [0, Math.PI/4, Math.PI/2, Math.PI*0.75];

    for (let i = 0; i < lineCount; i++) {
        let z = -Math.random() * 400;
        let rotZ = strictAngles[Math.floor(Math.random() * strictAngles.length)];
        
        let angle = Math.random() * Math.PI * 2;
        let radius = 5 + Math.random() * 20; 
        
        let c = colors[Math.floor(Math.random() * colors.length)];
        lineMesh.setColorAt(i, c);

        artifactData.push({
            type: 'line',
            idx: i,
            xOffset: Math.cos(angle) * radius,
            yOffset: Math.sin(angle) * radius,
            z: z,
            rotZ: rotZ,
            scaleMod: 0.5 + Math.random() * 1.5
        });
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        const time = clock.getElapsedTime();

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        // Massive signal booster so visual reacts deeply to all volumes
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 2.5);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 10; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 10; i < 100; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 10;
        let rawMids = midSum / 90;
        let rawTreble = trebleSum / 105;

        // Smooth envelopes
        envBass = smoothAudio(envBass, rawBass * 1.8);
        envMids = smoothAudio(envMids, rawMids * 1.8);
        envTreble = smoothAudio(envTreble, rawTreble * 2.0);

        // Update Tube Uniforms
        tubeUniforms.uTime.value = time;
        tubeUniforms.uBass.value = envBass;
        tubeUniforms.uMids.value = envMids;

        // 3. Update Artifacts (Rings & Lines flying at the camera)
        // Base flight speed + massive boost on Bass hits
        let flightSpeed = 1.0 + (envBass * 4.0);

        for (let i = 0; i < artifactData.length; i++) {
            let art = artifactData[i];
            
            // Move forward
            art.z += flightSpeed;
            
            // Loop back to the end of the tunnel if passed the camera
            if (art.z > 5) art.z = -400;

            // Follow the Snake Bend of the tunnel perfectly
            // (Math must match the Vertex Shader exactly)
            let dampening = Math.min(1.0, Math.max(0.0, Math.abs(art.z) / 150.0));
            let bendX = Math.sin(art.z * 0.01 + time * 0.8) * 40.0;
            let bendY = Math.cos(art.z * 0.015 + time * 0.6) * 40.0;

            let finalX = art.xOffset + (bendX * dampening * (1.0 + envMids * 1.5));
            let finalY = art.yOffset + (bendY * dampening * (1.0 + envMids * 1.5));

            dummy.position.set(finalX, finalY, art.z);

            if (art.type === 'ring') {
                // Rings dilate drastically with the Treble & Mids
                let scale = art.scaleMod * (1.0 + envTreble * 3.0);
                dummy.scale.set(scale, scale, scale);
                // Gentle tumble
                dummy.rotation.set(time * 0.5, time * 0.3, 0);
                dummy.updateMatrix();
                ringMesh.setMatrixAt(art.idx, dummy.matrix);
            } 
            else if (art.type === 'line') {
                // Lines extend and sharpen with the Treble
                let lengthScale = art.scaleMod * (1.0 + envTreble * 5.0);
                dummy.scale.set(1, 1, lengthScale); // Scale along Z
                
                // Strict angular correlation maintained
                dummy.rotation.set(0, 0, art.rotZ); 
                dummy.updateMatrix();
                lineMesh.setMatrixAt(art.idx, dummy.matrix);
            }
        }
        
        ringMesh.instanceMatrix.needsUpdate = true;
        lineMesh.instanceMatrix.needsUpdate = true;

        // Glow intensity of artifacts pulses with the beat
        artifactMat.opacity = 0.4 + (envTreble * 0.6);

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Infinite Audio Tunnel</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO ENTER TUNNEL ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    // Texture for GPU Shader
    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes & Flight Distance
    let envBass = 0, envMids = 0, envTreble = 0;
    let flightDistance = 0; // Tracks cumulative speed for smooth acceleration/deceleration
    
    const ATTACK = 0.25; 
    const RELEASE = 0.04; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.65; 
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.006); // Deep fog hides the end of the tunnel
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 0, 0); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO TEXTURE ---
    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- THE CYBER-TUBE SHADER ---
    const tubeGeo = new THREE.CylinderGeometry(30, 30, 400, 64, 128);
    tubeGeo.rotateX(Math.PI / 2); 
    tubeGeo.translate(0, 0, -200); 

    const tubeUniforms = {
        uTime: { value: 0 },
        uScroll: { value: 0 }, // Driven by bass-integrated speed
        uAudioTex: { value: audioTexture },
        uBass: { value: 0 },
        uMids: { value: 0 },
        uTreble: { value: 0 }
    };

    const tubeMaterial = new THREE.ShaderMaterial({
        uniforms: tubeUniforms,
        side: THREE.BackSide, 
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            uniform float uTime;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uMids;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                vUv = uv;
                vec3 pos = position;

                // Map Audio around the circumference of the tube
                float angle = atan(pos.y, pos.x);
                float freq = abs(angle / 3.14159); // 0 to 1
                float audioVal = texture2D(uAudioTex, vec2(freq, 0.5)).r;
                vAudioVal = audioVal;

                // Audio Expansion (Bass pushes the tunnel walls outward like a shockwave)
                float expansion = 1.0 + (audioVal * uBass * 0.5);
                pos.x *= expansion;
                pos.y *= expansion;

                // The Snake Bend
                float distFromCam = abs(pos.z);
                float dampening = smoothstep(0.0, 150.0, distFromCam); 
                
                float bendX = sin(pos.z * 0.01 + uTime * 0.8) * 40.0;
                float bendY = cos(pos.z * 0.015 + uTime * 0.6) * 40.0;
                
                // Mids amplify the writhing
                pos.x += bendX * dampening * (1.0 + uMids * 2.0);
                pos.y += bendY * dampening * (1.0 + uMids * 2.0);

                vPos = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uScroll;
            uniform float uBass;
            uniform float uTreble;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                // Scroll the texture perfectly synced to the accumulated flight speed
                vec2 scrolledUv = vUv;
                scrolledUv.y -= uScroll; 
                
                // Procedural Digital Grid
                vec2 grid = abs(fract(scrolledUv * vec2(40.0, 100.0)) - 0.5);
                float line = smoothstep(0.42, 0.5, max(grid.x, grid.y));
                
                float depthFade = exp(-abs(vPos.z) * 0.012);

                // Strict Palette: Soft Pink & Soft Blue
                vec3 pink = vec3(1.0, 0.71, 0.75);
                vec3 blue = vec3(0.67, 0.84, 0.90);
                
                // Alternate colors wrapping around the tube
                vec3 baseColor = mix(pink, blue, sin(vUv.x * 30.0) * 0.5 + 0.5);
                
                // Glow massively based on local frequency hitting the wall, plus global treble strikes
                vec3 finalColor = baseColor * line * (0.5 + vAudioVal * 4.0 + uTreble * 3.0);
                
                gl_FragColor = vec4(finalColor * depthFade, 1.0);
            }
        `
    });

    const tube = new THREE.Mesh(tubeGeo, tubeMaterial);
    scene.add(tube);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        let delta = clock.getDelta();
        const time = clock.getElapsedTime();

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 2.5);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 10; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 10; i < 100; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 10;
        let rawMids = midSum / 90;
        let rawTreble = trebleSum / 105;

        // Smooth envelopes
        envBass = smoothAudio(envBass, rawBass * 1.8);
        envMids = smoothAudio(envMids, rawMids * 1.8);
        envTreble = smoothAudio(envTreble, rawTreble * 2.0);

        // 3. FLIGHT SPEED MECHANIC
        // Base ambient speed is 0.2. Heavy bass accelerates you up to 6.0+
        let flightSpeed = 0.2 + (envBass * 6.0);
        
        // Accumulate distance instead of multiplying by raw time to prevent backward jumping/jitter
        flightDistance += flightSpeed * delta; 

        // Update Tube Uniforms
        tubeUniforms.uTime.value = time;
        tubeUniforms.uScroll.value = flightDistance; 
        tubeUniforms.uBass.value = envBass;
        tubeUniforms.uMids.value = envMids;
        tubeUniforms.uTreble.value = envTreble;

        // Add a slight camera shake on extreme bass hits
        camera.rotation.z = Math.sin(time * 15.0) * envBass * 0.05;
        camera.position.x = Math.cos(time * 20.0) * envBass * 0.5;
        camera.position.y = Math.sin(time * 22.0) * envBass * 0.5;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

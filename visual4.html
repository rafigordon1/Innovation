<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - Smooth Infinite Tunnel</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #init-overlay {
            position: absolute;
            z-index: 10;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div id="init-overlay">[ CLICK ANYWHERE TO ENTER TUNNEL ]</div>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let isRunning = false;
    let audioInitialized = false;

    let audioTexture;
    let audioData = new Uint8Array(256);

    // Audio Envelopes
    let envBass = 0, envMids = 0, envTreble = 0;
    
    // Flight Physics (Inertia)
    let flightDistance = 0; 
    let currentFlightSpeed = 0.1; // Base idle speed
    
    // Smoother attack/release to prevent twitching
    const ATTACK = 0.15; 
    const RELEASE = 0.02; 

    function smoothAudio(current, target) {
        return (target > current) 
            ? current + (target - current) * ATTACK 
            : current + (target - current) * RELEASE;
    }

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) {
            if (audioContext.state === 'suspended') await audioContext.resume();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.7; // Glides smoothly between frequency reads
            
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            document.getElementById('init-overlay').style.opacity = 0;
            audioInitialized = true;
            if (audioContext.state === 'running') isRunning = true;
            
        } catch (err) {
            console.warn("Microphone access denied.", err);
            document.getElementById('init-overlay').innerText = "[ MICROPHONE REQUIRED ]";
        }
    }
    
    window.addEventListener('load', initAudio);
    window.addEventListener('click', () => {
        initAudio();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
            isRunning = true;
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            document.body.style.opacity = 0;
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010101, 0.006); 
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 0, 0); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x010101, 1);
    document.body.appendChild(renderer.domElement);

    audioTexture = new THREE.DataTexture(audioData, 256, 1, THREE.LuminanceFormat, THREE.UnsignedByteType);
    audioTexture.magFilter = THREE.LinearFilter; 
    audioTexture.minFilter = THREE.LinearFilter;

    // --- THE CYBER-TUBE SHADER ---
    const tubeGeo = new THREE.CylinderGeometry(30, 30, 400, 64, 128);
    tubeGeo.rotateX(Math.PI / 2); 
    tubeGeo.translate(0, 0, -200); 

    const tubeUniforms = {
        uScroll: { value: 0 }, 
        uAudioTex: { value: audioTexture },
        uBass: { value: 0 },
        uMids: { value: 0 },
        uTreble: { value: 0 }
    };

    const tubeMaterial = new THREE.ShaderMaterial({
        uniforms: tubeUniforms,
        side: THREE.BackSide, 
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            uniform float uScroll;
            uniform sampler2D uAudioTex;
            uniform float uBass;
            uniform float uMids;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                vUv = uv;
                vec3 pos = position;

                // Map Audio around the circumference of the tube
                float angle = atan(pos.y, pos.x);
                float freq = abs(angle / 3.14159);
                float audioVal = texture2D(uAudioTex, vec2(freq, 0.5)).r;
                vAudioVal = audioVal;

                // Audio Expansion (Bass swells the tunnel)
                float expansion = 1.0 + (audioVal * uBass * 0.4);
                pos.x *= expansion;
                pos.y *= expansion;

                // The Snake Bend (Tied directly to uScroll so it moves perfectly with your flight)
                float distFromCam = abs(pos.z);
                float dampening = smoothstep(0.0, 150.0, distFromCam); 
                
                float bendX = sin(pos.z * 0.01 + uScroll * 1.5) * 40.0;
                float bendY = cos(pos.z * 0.015 + uScroll * 1.2) * 40.0;
                
                pos.x += bendX * dampening * (1.0 + uMids * 1.5);
                pos.y += bendY * dampening * (1.0 + uMids * 1.5);

                vPos = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uScroll;
            uniform float uBass;
            uniform float uTreble;

            varying vec2 vUv;
            varying float vAudioVal;
            varying vec3 vPos;

            void main() {
                // Scroll the texture perfectly synced to the accumulated flight distance
                vec2 scrolledUv = vUv;
                scrolledUv.y -= uScroll * 0.4; // Scaled to map geometry cleanly
                
                // Procedural Digital Grid
                // We stretch the grid rectangles longer down the Z-axis (Y in UV) 
                // to reinforce forward momentum and kill the wagon-wheel effect.
                vec2 grid = abs(fract(scrolledUv * vec2(30.0, 60.0)) - 0.5);
                
                // Vertical lines (running down the tunnel)
                float lineX = smoothstep(0.42, 0.5, grid.x);
                // Horizontal rings (thinner so they blur rather than strobe when moving fast)
                float lineY = smoothstep(0.48 + (uBass * 0.015), 0.5, grid.y); 
                
                float line = max(lineX, lineY);
                
                float depthFade = exp(-abs(vPos.z) * 0.012);

                // Strict Palette: Soft Pink & Soft Blue
                vec3 pink = vec3(1.0, 0.71, 0.75);
                vec3 blue = vec3(0.67, 0.84, 0.90);
                
                vec3 baseColor = mix(pink, blue, sin(vUv.x * 20.0 + uScroll) * 0.5 + 0.5);
                
                // Glow massively based on local frequency hitting the wall + treble strikes
                vec3 finalColor = baseColor * line * (0.4 + vAudioVal * 3.0 + uTreble * 2.0);
                
                gl_FragColor = vec4(finalColor * depthFade, 1.0);
            }
        `
    });

    const tube = new THREE.Mesh(tubeGeo, tubeMaterial);
    scene.add(tube);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (!isRunning) {
            renderer.render(scene, camera);
            return;
        }

        // Cap the delta to 0.1s maximum to prevent massive position jumps if the browser lags
        let delta = Math.min(clock.getDelta(), 0.1); 

        // 1. Audio Processing & GPU Texture Update
        analyser.getByteFrequencyData(dataArray);
        
        for(let i=0; i<dataArray.length; i++) {
            audioData[i] = Math.min(255, dataArray[i] * 2.5);
        }
        audioTexture.needsUpdate = true;

        // 2. Compute Global Audio Envelopes
        let bassSum = 0, midSum = 0, trebleSum = 0;
        for (let i = 0; i < 10; i++) bassSum += (dataArray[i] / 255.0);
        for (let i = 10; i < 100; i++) midSum += (dataArray[i] / 255.0);
        for (let i = 150; i < 255; i++) trebleSum += (dataArray[i] / 255.0);
        
        let rawBass = bassSum / 10;
        let rawMids = midSum / 90;
        let rawTreble = trebleSum / 105;

        envBass = smoothAudio(envBass, rawBass * 1.5);
        envMids = smoothAudio(envMids, rawMids * 1.5);
        envTreble = smoothAudio(envTreble, rawTreble * 1.5);

        // 3. SMOOTH INERTIA FLIGHT MECHANIC
        // Target speed based on bass. It never goes below 0.1 (always moving forward)
        let targetFlightSpeed = 0.1 + (envBass * 4.0);
        
        // Ease the current speed toward the target speed. This guarantees the movement
        // never jerks or snaps, giving it massive, smooth momentum.
        currentFlightSpeed += (targetFlightSpeed - currentFlightSpeed) * 0.1;
        
        // Accumulate distance cleanly
        flightDistance += currentFlightSpeed * delta; 

        // Update Tube Uniforms
        tubeUniforms.uScroll.value = flightDistance; 
        tubeUniforms.uBass.value = envBass;
        tubeUniforms.uMids.value = envMids;
        tubeUniforms.uTreble.value = envTreble;

        // Add a smooth camera float integrated with the flight distance
        camera.rotation.z = Math.sin(flightDistance * 2.0) * envBass * 0.05;
        camera.position.x = Math.cos(flightDistance * 3.0) * envBass * 0.8;
        camera.position.y = Math.sin(flightDistance * 3.5) * envBass * 0.8;

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

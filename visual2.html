<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioactive Visualizer - p5.js Nexus Rave</title>
    <!-- Import p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        body { transition: opacity 2s ease-in-out; }
    </style>
</head>
<body>

<script>
    // --- AUDIO & STATE ---
    let audioContext, analyser, dataArray;
    let smoothedEnergy = 0;
    let isRunning = false;
    let audioInitialized = false;
    
    // BPM / Shockwave state
    let lastTapTime = 0;
    let bpmInterval = 500; 
    let shockwaveRadius = 0;

    // Advanced Rate of Change Engine (Delta in ms)
    const keyState = {
        '1': { lastPress: 0, delta: 3000 }, // Hue Shift Speed
        '2': { lastPress: 0, delta: 3000 }, // Camera Zoom / Breath
        '3': { lastPress: 0, delta: 3000 }, // Complexity / Ring Count
        '4': { lastPress: 0, delta: 3000 }, // Audio Deformation multiplier
        '5': { lastPress: 0, delta: 3000 }, // Feedback / Trails Length
        '6': { lastPress: 0, delta: 3000 }, // Global Rotation Speed
        'ArrowLeft': { lastPress: 0, delta: 3000 } // Axis Twist / Chaos
    };

    // --- AUDIO INIT ---
    async function initAudio() {
        if (audioInitialized) return;
        try {
            // Because permissions were granted on index.html, this usually passes without a popup
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85; 
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            audioInitialized = true;
            // If the browser hasn't suspended the context, we can run immediately
            if (audioContext.state === 'running') {
                isRunning = true;
            }
        } catch (err) {
            console.warn("Microphone access pending or denied.", err);
        }
    }

    // Attempt auto-initialization immediately on load
    window.addEventListener('load', initAudio);

    // --- INPUT LOGIC & FALLBACK INIT ---
    function updateRate(key) {
        const now = performance.now();
        const state = keyState[key];
        if (state.lastPress > 0) {
            let d = now - state.lastPress;
            if (d < 4000) { 
                state.delta = (state.delta * 0.3) + (d * 0.7); // Smooth moving average
            }
        }
        state.lastPress = now;
    }

    function mapDelta(delta, fastVal, slowVal) {
        let clamped = Math.max(50, Math.min(4000, delta));
        let t = (clamped - 50) / (4000 - 50); // 0 = fast, 1 = slow
        return fastVal + t * (slowVal - fastVal);
    }

    window.addEventListener('keydown', async (e) => {
        // FALLBACK: If audio isn't initialized or is suspended, ANY keypress fixes it
        if (!audioInitialized) {
            await initAudio();
        }
        if (audioContext && audioContext.state === 'suspended') {
            await audioContext.resume();
            isRunning = true;
        }

        if (!isRunning) return;

        // Normal Key Logic
        if (keyState[e.key] !== undefined) {
            updateRate(e.key);
        } else if (e.key === 'ArrowRight') {
            const now = performance.now();
            if (lastTapTime > 0 && (now - lastTapTime) < 2000) {
                bpmInterval = now - lastTapTime;
            }
            lastTapTime = now;
            shockwaveRadius = 1.0; // Trigger visual shockwave
        } else if (e.key === ' ') {
            document.body.style.opacity = 0;
            // Fade out and return to the original WebGL visual
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    });

    // --- P5.JS SKETCH ---
    
    function setup() {
        let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
        setAttributes('preserveDrawingBuffer', true);
        
        colorMode(HSB, 360, 100, 100, 1.0);
        background(0);
        noStroke();
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(0);
    }

    function draw() {
        // If not running, keep the screen black but ready
        if (!isRunning) return;

        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let rawEnergy = sum / dataArray.length / 255;
        smoothedEnergy = smoothedEnergy * 0.8 + rawEnergy * 0.2; 

        // --- MAP DYNAMIC PARAMETERS ---
        let dynHueSpeed  = mapDelta(keyState['1'].delta, 5.0, 0.2);
        let dynCamBreath = mapDelta(keyState['2'].delta, 400, 20); 
        let dynDensity   = Math.floor(mapDelta(keyState['3'].delta, 128, 16)); 
        let dynDeform    = mapDelta(keyState['4'].delta, 400, 50); 
        let dynTrails    = mapDelta(keyState['5'].delta, 0.05, 0.4); 
        let dynSpeed     = mapDelta(keyState['6'].delta, 0.02, 0.002);
        let dynTwist     = mapDelta(keyState['ArrowLeft'].delta, 2.0, 0.05);

        // --- 1. FEEDBACK LAYER (TRAILS) ---
        blendMode(BLEND);
        push();
        translate(0, 0, -1000); 
        fill(0, 0, 0, dynTrails); 
        plane(width * 10, height * 10);
        pop();

        // Switch to additive blending for glowing neon visuals
        blendMode(ADD);

        // --- 2. CAMERA & ENVIRONMENT ---
        let time = millis();
        
        let zOffset = sin(time * 0.001 * dynCamBreath * 0.01) * dynCamBreath;
        translate(0, 0, zOffset);
        
        rotateX(time * dynSpeed);
        rotateY(time * dynSpeed * 0.8);
        rotateZ(time * dynSpeed * 0.5);

        if (shockwaveRadius > 0) {
            shockwaveRadius -= 0.02;
            if (shockwaveRadius < 0) shockwaveRadius = 0;
        }

        // --- 3. RENDER THE AUDIO NEXUS ---
        let baseHue = (time * 0.01 * dynHueSpeed) % 360;
        let step = Math.max(1, Math.floor(256 / dynDensity)); 
        
        for (let i = 0; i < 256; i += step) {
            let audioVal = dataArray[i] / 255.0; 
            let r = 100 + (audioVal * dynDeform) + (shockwaveRadius * 300); 
            
            push();
            
            rotateX((i * dynTwist) + (time * 0.0001));
            rotateY((i * dynTwist * 1.2));
            
            let currentHue = (baseHue + i * 0.5) % 360;
            stroke(currentHue, 80 + audioVal * 20, 10 + audioVal * 90, 0.4); 
            strokeWeight(1.5 + audioVal * 3);
            noFill();
            
            beginShape();
            for (let angle = 0; angle < TWO_PI; angle += PI/16) {
                let wave = sin(angle * 4 + time * 0.005) * (audioVal * 50);
                let x = cos(angle) * (r + wave);
                let y = sin(angle) * (r + wave);
                vertex(x, y, 0);
            }
            endShape(CLOSE);

            if (i % (step * 2) === 0) {
                stroke(255, 0, 100, 0.6); 
                strokeWeight(1);
                
                let vecLen = r + 50 + (audioVal * 200);
                
                line(r, 0, 0, vecLen, 0, 0);
                
                push();
                translate(vecLen, 0, 0);
                line(0, 0, 0, -10, -5, 0);
                line(0, 0, 0, -10, 5, 0);
                pop();
            }
            
            pop();
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Mimic Entity - Native Camera</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0c;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            filter: blur(3px) contrast(1.8);
        }
        #webcam {
            /* Now visible in the corner for debugging */
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid #555;
            background: #000;
            z-index: 1000;
            transform: scaleX(-1); /* Mirror the mini-feed */
        }
        #debug-log {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #00ff00;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="debug-log">System Initializing...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="shadowCanvas"></canvas>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('shadowCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const debugLog = document.getElementById('debug-log');

    function logStatus(msg) {
        debugLog.innerHTML += `<br>> ${msg}`;
        console.log(msg);
    }

    function resizeCanvas() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let pulseAngle = 0;
    function drawStandbyPulse() {
        if (videoElement.readyState >= 2 && debugLog.style.display === 'none') return; 
        canvasCtx.fillStyle = 'rgba(10, 10, 14, 0.2)';
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        canvasCtx.beginPath();
        canvasCtx.arc(canvasElement.width / 2, canvasElement.height / 2, 100 + Math.sin(pulseAngle) * 50, 0, 2 * Math.PI);
        canvasCtx.fill();
        pulseAngle += 0.05;
        requestAnimationFrame(drawStandbyPulse);
    }
    drawStandbyPulse();

    const LOOM_SCALE = 1.8; 
    const VERTICAL_OFFSET = 0.2;

    function getScaledPos(landmark) {
        if (!landmark || landmark.visibility < 0.2) return null;
        let nx = (landmark.x - 0.5) * LOOM_SCALE + 0.5;
        let ny = (landmark.y - 0.5 + VERTICAL_OFFSET) * LOOM_SCALE + 0.5;
        return {
            x: nx * canvasElement.width,
            y: ny * canvasElement.height,
            z: landmark.z
        };
    }

    function drawSpindlyBone(ctx, p1, p2, width, extensionFactor = 1.0) {
        const pos1 = getScaledPos(p1);
        const pos2 = getScaledPos(p2);
        
        if (!pos1 || !pos2) return;
        
        const dx = pos2.x - pos1.x;
        const dy = pos2.y - pos1.y;

        ctx.beginPath();
        ctx.moveTo(pos1.x, pos1.y);
        
        const steps = 6;
        for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const jitterX = (Math.random() - 0.5) * 20;
            const jitterY = (Math.random() - 0.5) * 20;
            ctx.lineTo(pos1.x + dx * t + jitterX, pos1.y + dy * t + jitterY);
        }
        
        ctx.lineWidth = width * LOOM_SCALE;
        ctx.strokeStyle = '#000000';
        ctx.stroke();
    }

    function onResults(results) {
        if (debugLog.style.display !== 'none') {
            debugLog.style.display = 'none';
        }

        canvasCtx.fillStyle = 'rgba(10, 10, 14, 0.25)';
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        canvasCtx.save();
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.shadowColor = 'rgba(0, 0, 0, 1)';
        canvasCtx.shadowBlur = 40;

        if (results.poseLandmarks) {
            const lms = results.poseLandmarks;
            const arms = [[11, 13, 15], [12, 14, 16]]; 
            
            const sL = getScaledPos(lms[11]);
            const sR = getScaledPos(lms[12]);
            const hL = getScaledPos(lms[23]);
            const hR = getScaledPos(lms[24]);

            if (sL && sR) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(sL.x, sL.y);
                canvasCtx.lineTo(sR.x, sR.y);
                if (hR) canvasCtx.lineTo(hR.x, hR.y);
                else canvasCtx.lineTo(sR.x, sR.y + 400); 
                if (hL) canvasCtx.lineTo(hL.x, hL.y);
                else canvasCtx.lineTo(sL.x, sL.y + 400); 
                canvasCtx.closePath();
                canvasCtx.fillStyle = '#020202';
                canvasCtx.fill();
            }

            const nose = getScaledPos(lms[0]);
            if (nose) {
                canvasCtx.beginPath();
                canvasCtx.ellipse(nose.x, nose.y - 30, 45 * LOOM_SCALE, 60 * LOOM_SCALE, 0, 0, 2 * Math.PI);
                canvasCtx.fillStyle = '#000000';
                canvasCtx.fill();
            }

            arms.forEach(arm => {
                drawSpindlyBone(canvasCtx, lms[arm[0]], lms[arm[1]], 15);
                drawSpindlyBone(canvasCtx, lms[arm[1]], lms[arm[2]], 10);
                
                const wrist = lms[arm[2]];
                const index = lms[arm[2] === 15 ? 19 : 20]; 
                const pinky = lms[arm[2] === 15 ? 17 : 18];
                
                if (wrist && index && pinky && wrist.visibility > 0.2) {
                    drawSpindlyBone(canvasCtx, wrist, index, 4, 4.5); 
                    drawSpindlyBone(canvasCtx, wrist, pinky, 4, 4.5);
                    
                    if (wrist.z < -0.3) {
                        const wPos = getScaledPos(wrist);
                        if(wPos) {
                            canvasCtx.fillStyle = 'rgba(200, 220, 255, 0.08)';
                            canvasCtx.beginPath();
                            canvasCtx.arc(wPos.x, wPos.y, 200 + Math.random() * 100, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        }
                    }
                }
            });
        }
        canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    
    pose.onResults(onResults);

    // Native Camera Setup
    async function startCamera() {
        try {
            logStatus("Requesting camera access...");
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480, facingMode: 'user' }, 
                audio: false 
            });
            videoElement.srcObject = stream;
            
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    resolve();
                };
            });
        } catch (err) {
            logStatus("ERROR: " + err.message);
            throw err;
        }
    }

    // Manual Frame Pumping
    async function processVideo() {
        try {
            await pose.send({ image: videoElement });
        } catch (e) {
            console.error(e);
        }
        // Keep pumping frames to the AI
        requestAnimationFrame(processVideo);
    }

    // Boot Sequence
    startCamera().then(() => {
        logStatus("Camera streaming. Initializing AI...");
        processVideo();
    }).catch(err => {
        console.error("Boot failed", err);
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Definition Glimmer Field</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            cursor: pointer;
            transition: opacity 1s ease-in-out;
            backdrop-filter: blur(10px);
        }
        .pulse-text {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-align: center;
        }
        .sub-text {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
            max-width: 400px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="pulse-text">Click to Start <br> High-Def Engine</div>
        <div class="sub-text">This requires microphone access. (Press ESC to exit fullscreen later)</div>
    </div>
    <canvas id="glcanvas"></canvas>

    <script>
        // --- FULLSCREEN HELPER ---
        function openFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx, analyser, dataArray;
        let audioData = { bass: 0, mid: 0, treb: 0 };
        let audioInitialized = false;

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.92; 

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch (err) {
                console.error("Audio initialization failed:", err);
                alert("Microphone access is required. Please check browser permissions and refresh.");
            }
        }

        function updateAudioData() {
            if (!audioInitialized) return;
            analyser.getByteFrequencyData(dataArray);
            
            let b = 0, m = 0, t = 0;
            for(let i = 0; i < 8; i++) b += dataArray[i]; // Deep Bass
            for(let i = 8; i < 48; i++) m += dataArray[i]; // Mids
            for(let i = 48; i < 110; i++) t += dataArray[i]; // Treble
            
            audioData.bass = (b / 8) / 255.0;
            audioData.mid = (m / 40) / 255.0;
            audioData.treb = (t / 62) / 255.0;
        }

        document.getElementById('overlay').addEventListener('click', async function() {
            openFullscreen();
            await initAudio();
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 1000);
        });

        // --- WEBGL ENGINE ---
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl2', { alpha: true, antialias: true });

        if (!gl) {
            alert("WebGL 2 not supported on this browser.");
        }

        const vsSource = `#version 300 es
            in vec2 a_position;
            out vec2 v_uv;
            void main() {
                v_uv = a_position * 0.5 + 0.5;
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fsSource = `#version 300 es
            precision highp float;
            in vec2 v_uv;
            out vec4 fragColor;

            uniform vec2 u_resolution;
            uniform float u_time;
            
            uniform float u_bass;
            uniform float u_mid;
            uniform float u_treb;

            // 3D noise function
            float noise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f*f*(3.0-2.0*f);
                float n = i.x + i.y*57.0 + 113.0*i.z;
                return mix(mix(mix( fract(sin(n)*43758.5453), fract(sin(n+1.0)*43758.5453),f.x),
                               mix( fract(sin(n+57.0)*43758.5453), fract(sin(n+58.0)*43758.5453),f.x),f.y),
                           mix(mix( fract(sin(n+113.0)*43758.5453), fract(sin(n+114.0)*43758.5453),f.x),
                               mix( fract(sin(n+170.0)*43758.5453), fract(sin(n+171.0)*43758.5453),f.x),f.y),f.z);
            }

            float smoothRange(float val, float minV, float maxV) {
                return minV + val * (maxV - minV);
            }

            // Mathematical Color Palette Generator
            vec3 palette( in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d ) {
                return a + b*cos( 6.28318*(c*t+d) );
            }

            void main() {
                vec2 uv = (v_uv - 0.5) * 2.0;
                uv.x *= u_resolution.x / u_resolution.y;

                float time = u_time * 0.15; 
                vec3 p = vec3(uv * 2.5, time);
                
                // Turbulence
                float turbulence = noise(p * 0.5 + time) * smoothRange(u_mid, 0.1, 0.6);
                p += turbulence * 0.3;

                // Cloud Density (Upgraded to 6 HD octaves for micro-detail)
                float density = 0.0;
                float scale = 1.0;
                for (int i = 0; i < 6; i++) {
                    density += noise(p * scale) / scale;
                    scale *= 2.0;
                }
                
                density = pow(density, smoothRange(u_bass, 1.8, 0.8));
                density = smoothstep(0.4, 0.95 + u_treb * 0.4, density);

                // --- DYNAMIC COLOR SHIFTING LOGIC ---
                float colorParam = density * 1.5 + (u_time * 0.05) - (u_bass * 1.5) + (u_mid * 0.8);
                
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 phase = vec3(0.0, 0.33, 0.67) + (u_treb * 2.5) + (u_time * 0.1); 
                
                vec3 baseColor = palette(colorParam, a, b, c, phase);
                vec3 finalColor = baseColor * pow(density, 1.5);
                
                // --- HD SHARP GLIMMER ---
                // Higher exponent (18.0) creates sharp, piercing light instead of soft blooms
                float glimmerIntensity = pow(density, 18.0) * (u_treb * 5.0 + 0.2);
                finalColor += vec3(1.0, 0.9, 0.8) * glimmerIntensity;

                // --- PIXEL-PERFECT STAR GLITTER ---
                // Reacts aggressively to high-hats/treble
                float hqGlitter = fract(sin(dot(uv + time, vec2(12.9898, 78.233))) * 43758.5453);
                finalColor += vec3(1.0, 0.8, 1.0) * pow(hqGlitter, 150.0) * (u_treb * 3.0);

                // Vignette frame
                float vignette = 1.0 - length(uv * 0.7);
                finalColor *= vignette;

                // Tone mapping for bright, saturated colors
                finalColor = 1.0 - exp(-finalColor * 2.5);

                fragColor = vec4(finalColor, 1.0);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader Compile Error:", gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posAttrib = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(posAttrib);
        gl.vertexAttribPointer(posAttrib, 2, gl.FLOAT, false, 0, 0);

        const locRes = gl.getUniformLocation(program, "u_resolution");
        const locTime = gl.getUniformLocation(program, "u_time");
        const locBass = gl.getUniformLocation(program, "u_bass");
        const locMid = gl.getUniformLocation(program, "u_mid");
        const locTreb = gl.getUniformLocation(program, "u_treb");

        function render(time) {
            // Uncapped Device Pixel Ratio - utilizes 100% of native screen hardware
            const dpr = window.devicePixelRatio || 1; 
            const w = window.innerWidth * dpr;
            const h = window.innerHeight * dpr;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w; canvas.height = h;
                gl.viewport(0, 0, w, h);
            }

            updateAudioData();

            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform2f(locRes, canvas.width, canvas.height);
            gl.uniform1f(locTime, time * 0.001);
            gl.uniform1f(locBass, audioData.bass);
            gl.uniform1f(locMid, audioData.mid);
            gl.uniform1f(locTreb, audioData.treb);

            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>

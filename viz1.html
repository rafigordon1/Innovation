<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Reactive Glimmer Field (Smoothed)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            cursor: pointer;
            transition: opacity 1s ease-in-out;
            backdrop-filter: blur(10px);
        }
        .pulse-text {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }
        .sub-text {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
            max-width: 400px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="pulse-text">Click to Start the Glimmer</div>
        <div class="sub-text">This requires microphone access to visualize your audio. You may need to refresh if permissions are denied.</div>
    </div>
    <canvas id="glcanvas"></canvas>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx, analyser, dataArray;
        let audioData = { bass: 0, mid: 0, treb: 0 };
        let audioInitialized = false;

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                // High smoothing constant (0.95) to significantly reduce jitter
                analyser.smoothingTimeConstant = 0.95; 

                // Requests microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
                console.log("Audio Engine Activated.");
            } catch (err) {
                console.error("Audio initialization failed:", err);
                alert("Microphone access is required for this visualization. Please check browser permissions and refresh.");
            }
        }

        function updateAudioData() {
            if (!audioInitialized) return;
            analyser.getByteFrequencyData(dataArray);
            
            let b = 0, m = 0, t = 0;
            for(let i = 0; i < 8; i++) b += dataArray[i]; // Deep Bass
            for(let i = 8; i < 48; i++) m += dataArray[i]; // Mids
            for(let i = 48; i < 110; i++) t += dataArray[i]; // Treble
            
            // Normalize values
            audioData.bass = (b / 8) / 255.0;
            audioData.mid = (m / 40) / 255.0;
            audioData.treb = (t / 62) / 255.0;
        }

        document.getElementById('overlay').addEventListener('click', async function() {
            await initAudio();
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 1000);
        });

        // --- WEBGL ENGINE ---
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl2', { alpha: true, antialias: true });

        if (!gl) {
            alert("WebGL 2 not supported on this browser.");
        }

        const vsSource = `#version 300 es
            in vec2 a_position;
            out vec2 v_uv;
            void main() {
                v_uv = a_position * 0.5 + 0.5;
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fsSource = `#version 300 es
            precision highp float;
            in vec2 v_uv;
            out vec4 fragColor;

            uniform vec2 u_resolution;
            uniform float u_time;
            
            // Audio Uniforms
            uniform float u_bass;
            uniform float u_mid;
            uniform float u_treb;

            // 3D noise function for smooth volume
            float noise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f*f*(3.0-2.0*f);
                float n = i.x + i.y*57.0 + 113.0*i.z;
                return mix(mix(mix( fract(sin(n)*43758.5453), fract(sin(n+1.0)*43758.5453),f.x),
                               mix( fract(sin(n+57.0)*43758.5453), fract(sin(n+58.0)*43758.5453),f.x),f.y),
                           mix(mix( fract(sin(n+113.0)*43758.5453), fract(sin(n+114.0)*43758.5453),f.x),
                               mix( fract(sin(n+170.0)*43758.5453), fract(sin(n+171.0)*43758.5453),f.x),f.y),f.z);
            }

            // Map audio values to smoother ranges
            float smoothRange(float val, float minV, float maxV) {
                return minV + val * (maxV - minV);
            }

            void main() {
                // Normalize coordinates
                vec2 uv = (v_uv - 0.5) * 2.0;
                uv.x *= u_resolution.x / u_resolution.y;

                // Flow through noise space
                float time = u_time * 0.15; // Slow down default flow
                vec3 p = vec3(uv * 2.5, time);
                
                // --- Glimmer Field Mechanics ---
                // Turbulence warps the space smoothly based on Mids
                float turbulence = noise(p * 0.5 + time) * smoothRange(u_mid, 0.1, 0.5);
                p += turbulence * 0.3;

                // Octaves of noise for a cloud structure
                float density = 0.0;
                float scale = 1.0;
                for (int i = 0; i < 4; i++) {
                    density += noise(p * scale) / scale;
                    scale *= 2.0;
                }
                
                // Modulate density with Audio
                // Bass drives overall size/depth. Treble drives edge sharpness.
                density = pow(density, smoothRange(u_bass, 1.6, 0.9));
                density = smoothstep(0.4, 0.95 + u_treb * 0.3, density);

                // --- Coloring ---
                vec3 colorDeep = vec3(0.01, 0.02, 0.08); // Black/Blue
                vec3 colorMid = vec3(0.1, 0.4, 0.9);   // Electric Blue
                vec3 colorHigh = vec3(1.0, 0.8, 0.95); // White Gold/Pink

                // Blend colors based on density and treble energy
                vec3 finalColor = mix(colorDeep, colorMid, density);
                // Glimmer highlights respond sharply to high frequencies
                float glimmerIntensity = pow(density, 10.0) * u_treb * 4.0;
                finalColor = mix(finalColor, colorHigh, glimmerIntensity);

                // Vignette
                float vignette = 1.0 - length(uv * 0.7);
                finalColor *= vignette;

                fragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- Shader Boilerplate ---
        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader Compile Error:", gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posAttrib = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(posAttrib);
        gl.vertexAttribPointer(posAttrib, 2, gl.FLOAT, false, 0, 0);

        const locRes = gl.getUniformLocation(program, "u_resolution");
        const locTime = gl.getUniformLocation(program, "u_time");
        const locBass = gl.getUniformLocation(program, "u_bass");
        const locMid = gl.getUniformLocation(program, "u_mid");
        const locTreb = gl.getUniformLocation(program, "u_treb");

        function render(time) {
            const dpr = Math.min(window.devicePixelRatio || 1, 2.0); 
            const w = window.innerWidth * dpr;
            const h = window.innerHeight * dpr;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w; canvas.height = h;
                gl.viewport(0, 0, w, h);
            }

            updateAudioData();

            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform2f(locRes, canvas.width, canvas.height);
            gl.uniform1f(locTime, time * 0.001);
            gl.uniform1f(locBass, audioData.bass);
            gl.uniform1f(locMid, audioData.mid);
            gl.uniform1f(locTreb, audioData.treb);

            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
